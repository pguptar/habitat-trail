    function closeInfo(){
      var info = state.infoMode;
      if(!info) return;
      state.infoMode = null;
      el.modal.hidden = true;
      el.sheet.innerHTML = "";
      if(info.opener && document.body.contains(info.opener) && info.opener.focus) info.opener.focus();
    }
    // Loads Leaflet once, only when needed. Fails (no internet) -> the list still works.
    var leafletPromise = null, leafletMap = null, mapMarkers = {};
    function loadLeaflet(){
      if(window.L && window.L.map) return Promise.resolve(window.L);
      if(leafletPromise) return leafletPromise;
      leafletPromise = new Promise(function(resolve, reject){
        var css = document.createElement("link");
        css.rel = "stylesheet"; css.href = options.leafletCssUrl || LEAFLET_CSS;
        document.head.appendChild(css);
        var js = document.createElement("script");
        js.src = options.leafletJsUrl || LEAFLET_JS; js.async = true;
        var timer = setTimeout(function(){ reject(new Error("timeout")); }, 15000);
        js.onload = function(){ clearTimeout(timer); if(window.L && window.L.map) resolve(window.L); else reject(new Error("no map library")); };
        js.onerror = function(){ clearTimeout(timer); reject(new Error("load failed")); };
        document.head.appendChild(js);
      }).catch(function(err){ leafletPromise = null; throw err; });
      return leafletPromise;
    }
    function destroyMap(){
      if(leafletMap){ try{ leafletMap.remove(); }catch(err){ /* already gone */ } leafletMap = null; mapMarkers = {}; }
    }
    // A simple drawn map that works with no internet: our places as landmarks, plus the player's pins.
    function milesApart(a, b){
      var r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
      var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 3958.8 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
    }
    function sketchMapHtml(W, H){
      var kid = isKid();
      var mapped = mapEntries(state.group).filter(function(p){ return p.located.length; });
      var pins = [];
      mapped.forEach(function(p){ p.located.forEach(function(s){ pins.push([s.lat, s.lng]); }); });
      // Landmarks: our places near the pins (only the ones inside the view are drawn).
      var zones = data.zones.filter(function(z){ return typeof z.lat === "number"; });
      if(pins.length){
        var near = function(z){ return Math.min.apply(null, pins.map(function(q){ return milesApart(q, [z.lat, z.lng]); })); };
        var sorted = zones.slice().sort(function(a, b){ return near(a) - near(b); });
        zones = sorted.filter(function(z, i){ return i < 1 || near(z) <= 1.5; });
      }
      // Fit the view to the pins (so nearby pins stay apart); with no pins, fit our places.
      var pts = pins.length ? pins.slice() : zones.map(function(z){ return [z.lat, z.lng]; });
      if(!pts.length) return "";
      var minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
      pts.forEach(function(q){ minLat = Math.min(minLat, q[0]); maxLat = Math.max(maxLat, q[0]); minLng = Math.min(minLng, q[1]); maxLng = Math.max(maxLng, q[1]); });
      W = Math.max(240, Math.round(W || 360)); H = Math.max(200, Math.round(H || 340));
      var pad = 40, k = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
      // At least about 600 m across, centred on the pins.
      var minSpan = 0.0055;
      if((maxLng - minLng) * k < minSpan){ var cx = (minLng + maxLng) / 2, hx = minSpan / k / 2; minLng = cx - hx; maxLng = cx + hx; }
      if(maxLat - minLat < minSpan){ var cy = (minLat + maxLat) / 2; minLat = cy - minSpan / 2; maxLat = cy + minSpan / 2; }
      var spanX = (maxLng - minLng) * k, spanY = maxLat - minLat;
      var scale = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
      var offX = (W - spanX * scale) / 2, offY = (H - spanY * scale) / 2;
      function xy(lat, lng){ return [offX + (lng - minLng) * k * scale, H - offY - (lat - minLat) * scale]; }
      var svg = '<svg class="hs-sketch" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + escapeHtml(T(kid, "Drawn map of your pins and our places", "Sketch map of sightings")) + '">' +
        '<rect width="' + W + '" height="' + H + '" class="hs-sketch-bg"></rect>';
      zones.forEach(function(z){
        var c = xy(z.lat, z.lng);
        if(c[0] < 14 || c[0] > W - 14 || c[1] < 14 || c[1] > H - 14) return;    // only places inside this view
        svg += '<g class="hs-sketch-zone"><title>' + escapeHtml(z.name) + '</title><circle cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="13"></circle>' +
          '<text x="' + c[0].toFixed(1) + '" y="' + (c[1] + 5).toFixed(1) + '" text-anchor="middle" font-size="14">' + escapeHtml(z.emoji || "📍") + '</text></g>';
      });
      // Tags must not cover any pin or another tag, so start with every pin's circle as "taken".
      var placed = mapped.map(function(p){
        var l = p.located[p.located.length - 1], c = xy(l.lat, l.lng);
        return {x:c[0] - 21, y:c[1] - 21, w:42, h:42};
      });
      mapped.forEach(function(p){
        p.located.forEach(function(s, i){
          var c = xy(s.lat, s.lng);
          if(i < p.located.length - 1) svg += '<circle class="hs-sketch-dot" cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="5"></circle>';
        });
        var last = p.located[p.located.length - 1], c2 = xy(last.lat, last.lng);
        // The name tag: a rounded label next to the pin. It moves down if it would cover another tag.
        var lw = String(p.name).length * 8.4 + 30, lh = 28;
        var right = c2[0] + 22 + lw < W - 4;
        var lx = right ? c2[0] + 22 : c2[0] - 22 - lw, ly = c2[1] - lh / 2;
        var hits = function(y){ return placed.some(function(q){ return lx < q.x + q.w && lx + lw > q.x && y < q.y + q.h && y + lh > q.y; }); };
        // Try spots below and above the pin, nearest first.
        for(var step = 1; step <= 12 && hits(ly); step++){
          var off = Math.ceil(step / 2) * (lh + 4) * (step % 2 ? 1 : -1);
          if(!hits(c2[1] - lh / 2 + off)){ ly = c2[1] - lh / 2 + off; break; }
        }
        placed.push({x:lx, y:ly, w:lw, h:lh});
        var moved = Math.abs(ly - (c2[1] - lh / 2)) > 1;
        svg += '<g class="hs-sketch-pin hs-sketch-' + escapeHtml(p.type) + '" data-key="' + escapeHtml(p.key) + '" role="button" tabindex="0" aria-label="' +
            escapeHtml(p.name + ". " + T(kid, "Tap for info", "Show details")) + '">' +
          (moved ? '<line class="hs-sketch-leader" x1="' + c2[0].toFixed(1) + '" y1="' + c2[1].toFixed(1) + '" x2="' + (right ? lx : lx + lw).toFixed(1) + '" y2="' + (ly + lh / 2).toFixed(1) + '"></line>' : '') +
          '<circle cx="' + c2[0].toFixed(1) + '" cy="' + c2[1].toFixed(1) + '" r="19"></circle>' +
          '<text x="' + c2[0].toFixed(1) + '" y="' + (c2[1] + 7).toFixed(1) + '" text-anchor="middle" font-size="20">' + escapeHtml(p.emoji) + '</text>' +
          '<rect class="hs-sketch-tag" x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" width="' + lw.toFixed(1) + '" height="' + lh + '" rx="14"></rect>' +
          '<text class="hs-sketch-label" x="' + (lx + 12).toFixed(1) + '" y="' + (ly + 19).toFixed(1) + '">' + escapeHtml(p.name) + ' ⓘ</text></g>';
      });
      return svg + '</svg>';
    }
    function drawMap(){
      var box = el.panel.querySelector(".hs-map"), status = el.panel.querySelector(".hs-map-status");
      if(!box) return;
      var kid = isKid();
      box.innerHTML = sketchMapHtml(box.clientWidth, box.clientHeight);    // shows right away, and stays if the street map can't load
      loadLeaflet().then(function(L){

        box.innerHTML = "";

          });

              html:'<span class="hs-pin-dot">' + escapeHtml(p.emoji) + '</span><span class="hs-pin-tag">' + escapeHtml(p.name) + ' ⓘ</span>'})
          }).addTo(map);
          marker.on("click", function(){ openInfo(p.key); });
          mapMarkers[p.key] = marker;
        });
        if(points.length) map.fitBounds(points, {padding:[40, 40], maxZoom:16});
        else map.fitBounds(data.zones.filter(function(z){ return typeof z.lat === "number"; }).map(function(z){ return [z.lat, z.lng]; }), {padding:[20, 20]});
        if(status) status.textContent = points.length ? T(kid, "Tap a name tag to learn about it. Small dots are your other sightings.", "Select a tag for details. Small dots are earlier sightings.") : status.textContent;
      }).catch(function(){
        if(!document.body.contains(box) || !status) return;
        status.textContent = T(kid, "No internet, so this is a drawn map: your pins next to our places (🌳 🏞️ 🌲). Tap a name tag to learn about it. Connect to see streets.",
          "Offline sketch map (no tiles). Landmarks are this app's places.");
      });
    }

    // ----- "Tell us what you know": notes for a species the app doesn't know -----
    function discById(id){ return (save.discoveries || []).filter(function(d){ return d.id === id; })[0] || null; }

    // ----- the Identify button: photograph any plant or animal, find out what it is, collect it -----
    function plantnetIdentify(blob){

      return fetch("https://my-api.plantnet.org/v2/identify/all?lang=en&api-key=" + encodeURIComponent(plantnetKey), {method:"POST", body:form}).then(function(res){
        if(res.status === 404) return {results:[]};                        // Pl@ntNet found no match
        if(res.status === 401 || res.status === 403) throw new Error("key");
        if(res.status === 429) throw new Error("limit");
        if(!res.ok) throw new Error("Pl@ntNet answered " + res.status);
        return res.json();
      }).then(function(json){ return (json && json.results) || []; });
    }
    // Sends the cleaned photo (no GPS) to the AI service proxy. The secret key lives there, never in this page.
    function aiServiceCall(url, kind){

      return function(blob){
        return fetch(full, {method:"POST", headers:{"content-type":"image/jpeg"}, body:blob}).then(function(res){
          if(res.status === 429) throw new Error("limit");
          if(!res.ok) throw new Error("AI service answered " + res.status);

      if(message === "limit") return kind === "animal"
        ? T(kid, "Today's animal IDs are used up. Come back tomorrow, or pick it from our list!",
                 "The daily animal identification limit has been reached. Choose the species or try again tomorrow.")
        : !plantnetKey

      return T(kid,
        "Couldn't reach the " + (kind === "plant" ? "plant" : "animal") + " expert right now. You can pick it from our list instead!",
        "Identification request failed (" + (message || "network error") + "). Common causes: the page isn't on an authorized domain, it was opened as a local file, or the device is offline.");

    // Works out what the answer means for the collection: is it one of ours, is it new, how many points.
    function buildAi(kind, found){
      var m = matchLocal(data.species, kind, found.scientific, found.name);
      var ai = {name:found.name, scientific:found.scientific || "", score:found.score, source:found.source, match:m.exact, relatives:m.relatives};
      ai.plantKey = (kind === "plant" && found.source === "plantnet") ? genusSpecies(found.scientific) : "";
      var bonus = ai.plantKey && !save.plants[ai.plantKey] ? POINTS.plantId : 0;
      if(m.exact){
        ai.duplicate = !!save.spotted[m.exact.id] && !!save.photos[m.exact.id];
        ai.points = (save.spotted[m.exact.id] ? 0 : POINTS.spot) + bonus;
      } else {
        ai.existing = findDiscovery(save.discoveries, kind, found.scientific, found.name);

    // Finds the plants near the player (or at the picked place) for the Identify sheet.

    function lookUpNearby(im){
      var kid = isKid();
      function show(near){
        im.near = near;

        if(cam.open) renderCamNear();
        var box = el.sheet.querySelector(".hs-near, .hs-near-hint");

        var p = state.place, z = null;

    function chooseKind(kind){

      if(!wantsPlantnet && !provider){ toPick(im, noAiNote(kind)); return; }
      var token = ++im.token;
      im.stage = "identifying";
      renderIdSheet();
      var job = wantsPlantnet
        ? plantnetIdentify(im.blob).then(function(results){
            var top = results[0];
            if(!top) return null;
            var sp = top.species || {};
            var sci = sp.scientificNameWithoutAuthor || "";
            var common = (sp.commonNames && sp.commonNames[0]) || sci;
            return {name:common.charAt(0).toUpperCase() + common.slice(1), scientific:sci, score:top.score || 0, source:"plantnet"};
          })
        : Promise.resolve().then(function(){ return provider(im.blob); }).then(function(res){
            var list = Array.isArray(res) ? res : (res && res.results ? res.results : (res ? [res] : []));
            var top = list[0];

      });

    function addDiscovery(d, blob, points){

    function addNewSpecies(im){

    // "Not right? Fix it": take the new species back out, return the points, and let the player choose.

      var id = im.addedId, a = im.ai;

      delete save.sightings["d-" + id];
      if(a.plantKey && save.plants[a.plantKey] && save.plants[a.plantKey].on === today()) delete save.plants[a.plantKey];
      if(im.addedPoints){
        save.points = Math.max(0, save.points - im.addedPoints);

    function finishAdded(im, name, again){
      im.done = true;
      if(!again) toast("📚 Added to your collection: " + name);
      if(state.idMode === im) closeIdentify();
      if(state.tab === "collection") renderPanel();
    }
    function confirmAi(){
      var im = state.idMode;
      if(!im || im.stage !== "result" || !im.ai) return;
      var a = im.ai, kind = im.kind, blob = im.blob;
      var name = a.match ? a.match.name : (a.existing ? a.existing.name : a.name);
      im.stage = "working";
      renderIdSheet();
      var work, addedKey = null;
      if(a.match) work = recordSighting(a.match.id, blob).then(function(){ return a.match.id; });
      else if(a.existing) work = photoStore.put("d-" + a.existing.id, blob).then(function(){
        if(photoUrls["d-" + a.existing.id]){ URL.revokeObjectURL(photoUrls["d-" + a.existing.id]); delete photoUrls["d-" + a.existing.id]; }
        return "d-" + a.existing.id;
      });
      else work = addDiscovery({name:a.name, scientific:a.scientific, type:kind, source:a.source}, blob, a.plantKey ? 0 : POINTS.spot).then(function(id){ return "d-" + id; });
      work.then(function(key){
        addedKey = key;
        if(a.plantKey && !save.plants[a.plantKey]){
          save.plants[a.plantKey] = {name:a.scientific, on:today()};
          writeSave(save);
          awardPoints(POINTS.plantId, "Identified a plant");
          checkBadges();
        }
        im.msg = "📍 " + T(isKid(), "Pinning your spot…", "Recording location…");
        if(state.idMode === im) renderIdSheet();
        return addSighting(key, name, kind === "plant");
      }).then(function(){
        im.msg = "";
        if(postingOn && addedKey && state.idMode === im){
          // Identified by AI and added: offer to post it.
          if(!a.duplicate) toast("📚 Added to your collection: " + name);
          im.done = true; im.added = {key:addedKey, name:name};
          im.stage = "added";
          renderIdSheet(".hs-post-open");
          if(state.tab === "collection") renderPanel();
          return;
        }
        finishAdded(im, name, a.duplicate);
      });
    }
    function confirmPick(){
      var im = state.idMode;
      if(!im || im.stage !== "pick" || !im.blob) return;
      var kid = isKid(), value = im.pick.value, blob = im.blob;
      if(!value){
        im.pick.error = T(kid, "Pick one from the list first!", "Choose a species or enter a name.");
        renderIdSheet(".hs-id-select");
        return;
      }
      if(value === "__other__"){
        var name = sanitizeName(im.pick.name);
        if(name.length < 2){
          im.pick.error = T(kid, "Type a name for it first!", "Enter a name (at least 2 characters).");
          renderIdSheet(".hs-id-name");
          return;
        }
        var existing = findDiscovery(save.discoveries, im.kind, "", name);
        im.stage = "working";
        renderIdSheet();
        (existing
          ? photoStore.put("d-" + existing.id, blob).then(function(){
              if(photoUrls["d-" + existing.id]){ URL.revokeObjectURL(photoUrls["d-" + existing.id]); delete photoUrls["d-" + existing.id]; }
              return existing.id;
            })
          : addDiscovery({name:name, scientific:"", type:im.kind, source:"you"}, blob, POINTS.spot)
        ).then(function(id){
          return addSighting("d-" + id, existing ? existing.name : name, im.kind === "plant").then(function(){ return id; });
        }).then(function(id){
          if(existing){ finishAdded(im, existing.name, true); return; }
          // Something the app doesn't know: let them write what they know about it.
          toast("📚 Added to your collection: " + name);
          im.done = true;
          if(state.idMode === im) closeIdentify();
          openNotes(id, true);
        });
      } else {
        var sp = idx.speciesById[value];
        if(!sp) return;
        im.stage = "working";
        renderIdSheet();
        var again = !!save.spotted[sp.id];
        recordSighting(sp.id, blob).then(function(){
          return addSighting(sp.id, sp.name, sp.type === "plant");
        }).then(function(){ finishAdded(im, sp.name, again); });
      }
    }

    // ----- drawing everything -----
    function renderMode(){
      el.mode.textContent = isKid() ? "👧 Kid view" : "🔬 Expert view";
      el.mode.setAttribute("aria-label", (isKid() ? "Kid view" : "Expert view") + ". Tap to switch.");
      el.identifyHint.textContent = T(isKid(), "Take a photo, find out what it is, and add it to your collection!", "Photograph an organism, identify it, and add it to your collection.");
    }
    function renderPoints(){ el.points.textContent = "⭐ " + save.points + " points"; }
    function renderWhere(){
      var areaId = placeAreaId(idx, state.place);
      el.areas.innerHTML = data.areas.map(function(a){
        return '<button type="button" class="hs-area-btn" data-area="' + escapeHtml(a.id) + '" title="' + escapeHtml(a.name) + '" aria-pressed="' + (a.id === areaId) + '">' +
          '<span class="hs-area-emoji" aria-hidden="true">' + escapeHtml(areaEmoji(a, idx)) + '</span>' +
          '<span class="hs-area-name">' + escapeHtml(a.short || a.name) + '</span></button>';
      }).join("");
      if(!areaId){ el.zones.innerHTML = ""; return; }
      var zones = idx.zonesByArea[areaId] || [];
      el.zones.innerHTML = '<p class="hs-zones-title">' + T(isKid(), "Or pick one spot:", "Narrow to one place:") + '</p><div class="hs-chips">' +
        '<button type="button" class="hs-chip" data-zone="" aria-pressed="' + (state.place.kind === "area") + '">All of it</button>' +
        zones.map(function(z){
          return '<button type="button" class="hs-chip" data-zone="' + escapeHtml(z.id) + '" aria-pressed="' + (state.place.kind === "zone" && state.place.id === z.id) + '">' +
            escapeHtml(z.emoji) + ' ' + escapeHtml(z.name) + (z.fireHistory ? ' 🔥' : '') + '</button>';
        }).join("") + '</div>';
    }
    function renderSafety(){
      var s = state.place ? safetyFor(idx, state.place) : null;
      if(!s){ el.safety.hidden = true; el.safety.innerHTML = ""; return; }
      el.safety.hidden = false;
      el.safety.className = "hs-safety hs-safety-" + s.level;
      el.safety.innerHTML = "⚠️ <strong>" + escapeHtml(s.title) + ":</strong> " + escapeHtml(s.text);
    }
    function renderTabs(){
      Array.prototype.forEach.call(el.tabs, function(t){
        t.setAttribute("aria-selected", String(t.getAttribute("data-tab") === state.tab));
      });
    }
    function renderPanel(){
      destroyMap();
      if(state.tab === "map"){
        el.panel.innerHTML = mapHtml();
        drawMap();
        return;
      }
      if(state.tab === "posts"){
        el.panel.innerHTML = postsHtml();
        return;
      }
      if(state.tab === "collection"){
        el.panel.innerHTML = collectionHtml(ctx());
        hydratePhotos();
        return;
      }
      if(!state.place){ el.panel.innerHTML = promptHtml(isKid()); return; }
      if(state.tab === "fire"){
        el.panel.innerHTML = fireHtml(ctx());
        rewardFire();
      } else {
        el.panel.innerHTML = hereHtml(ctx());
      }
      hydratePhotos();
    }
    function renderBadges(){
      var kid = isKid();
      el.badges.innerHTML = '<h3 class="hs-badges-title">' + T(kid, "Your badges", "Badges") + '</h3><div class="hs-badge-row">' +
        badges.map(function(b){
          var earned = !!save.badges[b.id];
          return '<div class="hs-badge' + (earned ? ' is-earned' : '') + '">' +
            '<span class="hs-badge-emoji" aria-hidden="true">' + (earned ? b.emoji : "🔒") + '</span>' +
            '<span class="hs-badge-name">' + escapeHtml(b.name) + (earned ? '' : ' <span class="hs-visually-hidden">(locked)</span>') + '</span>' +
            '<span class="hs-badge-how">' + escapeHtml(b.how) + '</span></div>';
        }).join("") + '</div>';
    }
    function renderAll(){
      renderMode(); renderPoints(); renderWhere(); renderSafety(); renderTabs(); renderPanel(); renderBadges();
    }

    // ----- what happens when you tap things -----
    el.areas.addEventListener("click", function(e){
      var btn = e.target.closest ? e.target.closest(".hs-area-btn") : null;
      if(btn) choosePlace({kind:"area", id:btn.getAttribute("data-area")});
    });
    el.zones.addEventListener("click", function(e){
      var btn = e.target.closest ? e.target.closest(".hs-chip") : null;
      if(!btn || !state.place) return;
      var zoneId = btn.getAttribute("data-zone");
      choosePlace(zoneId ? {kind:"zone", id:zoneId} : {kind:"area", id:placeAreaId(idx, state.place)});
      showResults();
    });
    el.navBack.addEventListener("click", goBack);
    el.resume.addEventListener("click", function(e){
      var b = e.target.closest ? e.target.closest("button") : null;
      if(!b) return;
      if(b.classList.contains("hs-resume-go")) resumePaused();
      else if(b.classList.contains("hs-resume-drop")){ clearPaused(); el.identify.focus(); }
    });
    el.gps.addEventListener("click", useLocation);
    Array.prototype.forEach.call(el.tabs, function(t){
      t.addEventListener("click", function(){
        if(state.tab === t.getAttribute("data-tab")) return;
        remember();
        state.tab = t.getAttribute("data-tab");
        if(state.tab === "posts") loadFeed();
        renderNavBack();
        renderTabs();
        renderPanel();
      });
    });
    // Enter or Space on a drawn-map tag opens it too.
    el.panel.addEventListener("keydown", function(e){
      var tag = e.target.closest ? e.target.closest(".hs-sketch-pin[data-key]") : null;
      if(tag && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); openInfo(tag.getAttribute("data-key")); }
    });
    el.mode.addEventListener("click", function(){
      save.mode = isKid() ? "expert" : "kid";
      writeSave(save);
      renderMode(); renderWhere(); renderBadges(); renderPanel(); renderResume(); renderNavBack();
    });
    // One listener for every button inside the panel (they get redrawn often).
    el.panel.addEventListener("click", function(e){
      var tag = e.target.closest ? e.target.closest(".hs-sketch-pin[data-key]") : null;
      if(tag){ openInfo(tag.getAttribute("data-key")); return; }
      var btn = e.target.closest ? e.target.closest("button") : null;
      if(!btn || !el.panel.contains(btn)) return;
      if(btn.classList.contains("hs-chip")){
        state.group = btn.getAttribute("data-group");
        renderPanel();
      } else if(btn.classList.contains("hs-spot") || btn.classList.contains("hs-retake")){
        openPhotoMode(btn.getAttribute("data-id"));
      } else if(btn.classList.contains("hs-map-item")){
        var mk = mapMarkers[btn.getAttribute("data-key")];
        if(mk && leafletMap) leafletMap.setView(mk.getLatLng(), Math.max(leafletMap.getZoom(), 15));
        openInfo(btn.getAttribute("data-key"));
      } else if(btn.classList.contains("hs-notes-open")){
        openNotes(btn.getAttribute("data-disc"), false);
      } else if(btn.classList.contains("hs-feed-refresh")){
        loadFeed(); renderPanel();
      } else if(btn.classList.contains("hs-report")){
        feed.reportAsk = btn.getAttribute("data-id"); renderPanel();
        var yes = el.panel.querySelector(".hs-report-yes"); if(yes) yes.focus();
      } else if(btn.classList.contains("hs-report-no")){
        feed.reportAsk = null; renderPanel();
      } else if(btn.classList.contains("hs-report-yes")){
        var rid = btn.getAttribute("data-id");
        fetch(postsBase + "/posts/" + encodeURIComponent(rid) + "/report", {method:"POST"}).catch(function(){});
        feed.posts = (feed.posts || []).filter(function(p){ return p.id !== rid; });    // hide it on this phone right away
        feed.reportAsk = null;
        toast(T(isKid(), "Thanks! A grown-up will take a look.", "Reported."));
        renderPanel();
      } else if(btn.classList.contains("hs-post-del")){
        var did = btn.getAttribute("data-id"), mp = save.myPosts.filter(function(m){ return m.id === did; })[0];
        if(mp){
          fetch(postsBase + "/posts/" + encodeURIComponent(did), {method:"DELETE", headers:{"x-delete-token":mp.token}}).then(function(r){
            if(!r.ok) throw new Error();
            save.myPosts = save.myPosts.filter(function(m){ return m.id !== did; });
            writeSave(save);
            if(feed.posts) feed.posts = feed.posts.filter(function(p){ return p.id !== did; });
            toast(T(isKid(), "Deleted your post.", "Post deleted."));
            renderPanel();
          }).catch(function(){ toast(T(isKid(), "Couldn't delete it right now. Try again later.", "Delete failed.")); });
        }
      } else if(btn.classList.contains("hs-go-burn")){
        choosePlace({kind:"zone", id:btn.getAttribute("data-zone")});
      }
    });

    // Buttons inside the photo mode and Identify sheets.
    function closeModal(){
      if(state.notesMode){ closeNotes(); return; }
      if(state.postMode){ closePost(); return; }
      if(state.infoMode){ closeInfo(); return; }
      if(state.photoMode) closePhotoMode();
      else if(state.idMode) closeIdentify();
    }
    el.modal.addEventListener("click", function(e){
      var t = e.target.closest ? e.target.closest("button, .hs-modal-backdrop") : null;
      if(!t || !el.modal.contains(t)) return;
      if(t.classList.contains("hs-modal-backdrop") || t.classList.contains("hs-sheet-cancel")) closeModal();
      else if(t.classList.contains("hs-sheet-back")) sheetBack();
      else if(t.classList.contains("hs-notes-open")){
        var nd = t.getAttribute("data-disc");
        if(state.infoMode) closeInfo();
        if(state.idMode){ state.idMode.done = true; closeIdentify(); }
        openNotes(nd, false);
      }
      else if(t.classList.contains("hs-notes-save")) saveNotes();
      else if(t.classList.contains("hs-post-open")){
        var pk = t.getAttribute("data-key");
        if(state.notesMode) closeNotes();
        if(state.infoMode) closeInfo();
        if(state.idMode){ state.idMode.done = true; closeIdentify(); }
        openPost(pk);
      }
      else if(t.classList.contains("hs-post-send")) sendPost();
      else if(t.classList.contains("hs-post-see")){
        closePost();
        if(state.tab !== "posts"){ remember(); state.tab = "posts"; renderTabs(); renderNavBack(); }
        loadFeed(); renderPanel();
        var tabBtn = root.querySelector('.hs-tab[data-tab="posts"]'); if(tabBtn) tabBtn.focus();
      }
      else if(t.classList.contains("hs-info-again")){ var sid = t.getAttribute("data-id"); closeInfo(); openPhotoMode(sid); }
      else if(t.classList.contains("hs-near-plant")){
        var pid = t.getAttribute("data-id");
        if(state.idMode){ state.idMode.done = true; closeIdentify(); }
        openPhotoMode(pid);
      }
      else if(t.classList.contains("hs-open-camera")){
        if(state.idMode && liveCameraOk()) openLiveCamera();
        else el.inCamera.click();
      }
      else if(t.classList.contains("hs-open-library")) el.inLibrary.click();
      else if(t.classList.contains("hs-save")) savePhotoMode();
      else if(t.classList.contains("hs-id-kind")) chooseKind(t.getAttribute("data-kind"));
      else if(t.classList.contains("hs-id-add")) confirmAi();
      else if(t.classList.contains("hs-id-pick")){ if(state.idMode) toPick(state.idMode, ""); }
      else if(t.classList.contains("hs-id-confirm")) confirmPick();
      else if(t.classList.contains("hs-id-undo")) undoNewSpecies();
      else if(t.classList.contains("hs-id-done")){ var imd = state.idMode; if(imd){ if(imd.stage !== "added") toast("📚 " + imd.ai.name + " is in your collection!"); closeIdentify(); } }
    });
    el.modal.addEventListener("change", function(e){
      if(state.notesMode && e.target.classList.contains("hs-notes-r")){ state.notesMode.rarity = e.target.value; return; }
      if(state.postMode && e.target.classList.contains("hs-post-check")){
        state.postMode.checks[e.target.getAttribute("data-c")] = e.target.checked;
        return;
      }
      var im = state.idMode;
      if(!im || !e.target.classList.contains("hs-id-select")) return;
      im.pick.value = e.target.value;
      im.pick.error = "";
      var box = el.sheet.querySelector(".hs-id-namebox");
      if(box) box.hidden = e.target.value !== "__other__";
      var err = el.sheet.querySelector(".hs-id-error");
      if(err && err.parentNode) err.parentNode.removeChild(err);
      if(e.target.value === "__other__"){
        var nameBox = el.sheet.querySelector(".hs-id-name");
        if(nameBox) nameBox.focus();
      }
    });
    el.modal.addEventListener("input", function(e){
      if(state.notesMode){
        if(e.target.classList.contains("hs-notes-where")) state.notesMode.where = e.target.value;
        if(e.target.classList.contains("hs-notes-facts-in")){
          state.notesMode.facts = e.target.value;
          var nc = el.sheet.querySelector(".hs-notes-count"); if(nc) nc.textContent = e.target.value.length + " / 400";
        }
        return;
      }
      if(state.postMode && e.target.classList.contains("hs-post-text")){
        state.postMode.text = e.target.value;
        var c = el.sheet.querySelector(".hs-post-count"); if(c) c.textContent = e.target.value.length + " / 500";
      }
      if(state.idMode && e.target.classList.contains("hs-id-name")) state.idMode.pick.name = e.target.value;
    });
    [el.inCamera, el.inLibrary].forEach(function(input){
      input.addEventListener("change", function(){
        var file = input.files && input.files[0];
        if(file){
          if(state.idMode) handleIdPicked(file);
          else handlePicked(file);
        }
        input.value = "";            // so picking the same photo again still counts
      });
    });
    el.identify.addEventListener("click", openIdentify);
    // Escape closes a sheet, Enter in the name box adds it, and Tab stays inside the sheet.
    root.addEventListener("keydown", function(e){
      if(!state.photoMode && !state.idMode && !state.infoMode && !state.postMode && !state.notesMode) return;
      if(e.key === "Escape"){ closeModal(); return; }
      if(e.key === "Enter" && state.idMode && e.target.classList && e.target.classList.contains("hs-id-name")){
        e.preventDefault();
        confirmPick();
        return;
      }
      if(e.key !== "Tab") return;
      var items = Array.prototype.slice.call(el.sheet.querySelectorAll("button:not([disabled]), select, input[type=text], input[type=checkbox], input[type=radio], textarea")).filter(function(n){ return !n.closest("[hidden]"); });
      if(!items.length) return;
      var first = items[0], last = items[items.length - 1], at = document.activeElement;
      if(items.indexOf(at) === -1){ e.preventDefault(); first.focus(); }
      else if(e.shiftKey && at === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && at === last){ e.preventDefault(); first.focus(); }
    });

    renderAll();

    // A few things the main app can use.
    return {
      getPoints: function(){ return save.points; },
      reset: function(){
        closePhotoMode();
        closeIdentify();
        Object.keys(photoUrls).forEach(function(id){ URL.revokeObjectURL(photoUrls[id]); });
        photoUrls = {};
        photoStore.clear();
        save = blankSave();
        writeSave(save);
        clearPaused();
        state.history = [];
        renderAll();
        renderNavBack();
      }
    };
  }

  window.HabitatScan = {
    mount: mount,
    // Exposed only so the logic can be tested.
    _test: {
      buildIndex: buildIndex, speciesForPlace: speciesForPlace, burnedZones: burnedZones, nearestZone: nearestZone,
      fireGroups: fireGroups, safetyFor: safetyFor, matchLocalPlant: matchLocalPlant, genusSpecies: genusSpecies,
      cardHtml: cardHtml, hereHtml: hereHtml, fireHtml: fireHtml, promptHtml: promptHtml,
      matchLocal: matchLocal, findDiscovery: findDiscovery, sanitizeName: sanitizeName, collectionHtml: collectionHtml,
      discoveryCardHtml: discoveryCardHtml, identifySheetHtml: identifySheetHtml,
      sortForDisplay: sortForDisplay, blankSave: blankSave, sheetHtml: sheetHtml, spotButtonHtml: spotButtonHtml
    }
  };
})();

</script>
<script>
  // OPTIONAL (plants): ask an adult to paste a free key from my.plantnet.org between the quotes.
  var PLANTNET_API_KEY = "2b10t5GyIN0iVGpLR4WQXYugFe";

  // OPTIONAL (animals, and plants if there's no Pl@ntNet key): the web address of your animal-service (see the animal-service folder).
  // Example: "https://habitat-animal-service.YOURNAME.workers.dev". Leave empty to turn animal naming off.
  var ANIMAL_SERVICE_URL = "";

  // Everything else works without either one.

  HabitatScan.mount(document.getElementById("habitat-scan"), {
    plantnetApiKey: PLANTNET_API_KEY,
    animalServiceUrl: ANIMAL_SERVICE_URL,
    onPoints: function(points, reason){
      // The main app can add these points to its own score here.
      console.log("Explore nearby points:", points, reason);
    }
  });
</script>
</body>
