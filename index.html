<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habitat Trail: Explore nearby</title>
<style>
/*
  Habitat Trail: Explore nearby styles
  ------------------------------------
  Every color is a variable, so the main app can change them.
  Light colors by default, dark when the device is in dark mode.
  Force one with data-theme="light" or data-theme="dark" on the box.
  Make all text bigger with --hs-scale (for example 1.2).
*/
.hs{
  --hs-scale: 1;
  --hs-bg: #f3f1ea;        /* ash */
  --hs-surface: #ffffff;
  --hs-text: #1d2620;      /* charcoal */
  --hs-muted: #4c574f;
  --hs-border: #d6d1c3;
  --hs-chip: #e6ebe2;
  --hs-accent: #3d6b4a;    /* sage */
  --hs-accent-text: #ffffff;
  --hs-star: #8a5a00;
  --hs-warn-bg: #fdeee3;
  --hs-warn-text: #6b2f0e;
  --hs-warn-edge: #d9692e; /* fire poppy */
  --hs-good-bg: #e3f1e6;
  --hs-r-common: #5b6150;
  --hs-r-uncommon: #2f6b45;
  --hs-r-rare: #1d5e8c;
  --hs-r-epic: #6b3a8f;
  --hs-r-legendary: #8a5a00;
  --hs-invasive-bg: #efe3f3;
  --hs-invasive-text: #55266f;
  --hs-fire-bg: #fde4d2;
  --hs-fire-text: #7a2f0b;

  font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
  font-size: calc(17px * var(--hs-scale));
  line-height: 1.5;
  color: var(--hs-text);
  background: var(--hs-bg);
  border-radius: 22px;
  padding: 18px;
  box-sizing: border-box;
}
/* set directly (not inherit): inside <details>, Chrome doesn't pass box-sizing down, which pushed buttons past the card edge */
.hs *, .hs *::before, .hs *::after{ box-sizing: border-box; }

.hs[data-theme="dark"]{
  color-scheme: dark;
  --hs-bg: #0f1511; --hs-surface: #18211b; --hs-text: #eef0ea; --hs-muted: #b9c4ae;
  --hs-border: #2e3b31; --hs-chip: #212c24; --hs-accent: #e9c876; --hs-accent-text: #1a1406;
  --hs-star: #e9c876; --hs-warn-bg: #3a2214; --hs-warn-text: #ffd9bd; --hs-warn-edge: #e07a43;
  --hs-good-bg: #1c3324;
  --hs-r-common: #c9c15a; --hs-r-uncommon: #7fd6a0; --hs-r-rare: #8cc4f0; --hs-r-epic: #d2a6f0; --hs-r-legendary: #f0c24a;
  --hs-invasive-bg: #3a2447; --hs-invasive-text: #e8c9f5;
  --hs-fire-bg: #43240f; --hs-fire-text: #ffd2b0;
}
@media (prefers-color-scheme: dark){
  .hs:not([data-theme="light"]){
    color-scheme: dark;
    --hs-bg: #0f1511; --hs-surface: #18211b; --hs-text: #eef0ea; --hs-muted: #b9c4ae;
    --hs-border: #2e3b31; --hs-chip: #212c24; --hs-accent: #e9c876; --hs-accent-text: #1a1406;
    --hs-star: #e9c876; --hs-warn-bg: #3a2214; --hs-warn-text: #ffd9bd; --hs-warn-edge: #e07a43;
    --hs-good-bg: #1c3324;
    --hs-r-common: #c9c15a; --hs-r-uncommon: #7fd6a0; --hs-r-rare: #8cc4f0; --hs-r-epic: #d2a6f0; --hs-r-legendary: #f0c24a;
    --hs-invasive-bg: #3a2447; --hs-invasive-text: #e8c9f5;
    --hs-fire-bg: #43240f; --hs-fire-text: #ffd2b0;
  }
}

/* ---------- top bar ---------- */
.hs-top{ display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.hs-title{ margin: 0; font-size: 1.7em; line-height: 1.1; font-weight: 800; letter-spacing: -0.01em; }
.hs-top-right{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hs-points{
  font-weight: 800; color: var(--hs-star); background: var(--hs-chip);
  padding: 0.35em 0.85em; border-radius: 999px; white-space: nowrap;
}

/* ---------- buttons ---------- */
.hs-btn{
  min-height: 44px; padding: 0.5em 1em; border-radius: 12px;
  border: 1.5px solid var(--hs-border); background: var(--hs-surface); color: var(--hs-text);
  font: inherit; font-weight: 700; cursor: pointer;
}
.hs-btn:hover{ border-color: var(--hs-accent); }
.hs-btn-primary{ background: var(--hs-accent); color: var(--hs-accent-text); border-color: transparent; }
.hs button:focus-visible, .hs a:focus-visible, .hs summary:focus-visible, .hs-photo-btn:focus-within{
  outline: 3px solid var(--hs-star); outline-offset: 2px;
}

/* ---------- choosing a place ---------- */
.hs-where{ margin: 16px 0 4px; }
.hs-where-title{ margin: 0 0 8px; font-weight: 800; font-size: 1.05em; }
.hs-areas{ display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.hs-area-btn{
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 84px; padding: 8px; text-align: center; font-size: 0.95em;
  border-radius: 16px; border: 2px solid var(--hs-border); background: var(--hs-surface); color: var(--hs-text);
  font: inherit; font-weight: 700; line-height: 1.25; cursor: pointer;
}
.hs-area-btn:hover{ border-color: var(--hs-accent); }
.hs-area-btn[aria-pressed="true"]{ border-color: var(--hs-accent); background: var(--hs-chip); box-shadow: inset 0 0 0 1px var(--hs-accent); }
.hs-area-emoji{ font-size: 1.9em; line-height: 1.1; flex: none; }
.hs-zones{ margin-top: 12px; }
.hs-zones-title{ margin: 0 0 6px; color: var(--hs-muted); font-weight: 700; font-size: 0.92em; }
.hs-gps{ margin-top: 12px; }
.hs-gps-note{ margin: 6px 0 0; color: var(--hs-muted); font-size: 0.9em; min-height: 1.5em; }

.hs-safety, .hs-note-warn{
  background: var(--hs-warn-bg); color: var(--hs-warn-text);
  border-left: 6px solid var(--hs-warn-edge); border-radius: 12px; padding: 0.8em 1em;
}
.hs-safety{ margin: 10px 0; }
.hs-safety-line{ margin: 16px 0 0; font-weight: 700; color: var(--hs-warn-text); }

/* ---------- tabs ---------- */
.hs-tabs{
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
  background: var(--hs-chip); padding: 4px; border-radius: 16px; margin: 14px 0 16px;
}
.hs-tab{
  min-height: 46px; border: none; border-radius: 12px; background: transparent;
  color: var(--hs-text); font: inherit; font-weight: 700; cursor: pointer; padding: 0.3em 0.4em;
}
.hs-tab[aria-selected="true"]{ background: var(--hs-surface); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); }

/* ---------- panel content ---------- */
.hs-intro{ margin: 0 0 10px; max-width: 60ch; }
.hs-blurb{ margin: 0 0 10px; }
.hs-muted{ color: var(--hs-muted); font-size: 0.9em; margin: 4px 0 0; }
.hs-loading{ text-align: center; padding: 2.2em 0; font-size: 1.1em; font-weight: 700; color: var(--hs-muted); }
.hs-note{ background: var(--hs-chip); border-radius: 12px; padding: 0.8em 1em; margin: 14px 0; }
.hs-note p{ margin: 0 0 0.6em; }
.hs-note p:last-child{ margin-bottom: 0; }
.hs-note-good{ background: var(--hs-good-bg); }
.hs-source{ margin: 18px 0 0; font-size: 0.82em; color: var(--hs-muted); }
.hs-source a, .hs-link{ color: var(--hs-accent); font-weight: 700; }
.hs-prompt{ text-align: center; padding: 2em 1em; font-size: 1.1em; font-weight: 700; color: var(--hs-muted); }
.hs-prompt p{ margin: 0; }
.hs-prompt-emoji{ font-size: 2.4em; margin-bottom: 0.2em !important; }

/* progress bar */
.hs-progress{ margin: 6px 0 12px; }
.hs-bar{ height: 10px; background: var(--hs-chip); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
.hs-bar span{ display: block; height: 100%; background: var(--hs-accent); border-radius: 999px; transition: width 0.3s ease; }

/* filter chips (place spots and Plants/Animals) */
.hs-chips{ display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.hs-zones .hs-chips{ margin-bottom: 0; }
.hs-chip{
  min-height: 40px; border-radius: 999px; padding: 0.3em 0.9em; font: inherit; font-weight: 700; cursor: pointer;
  border: 1.5px solid var(--hs-border); background: var(--hs-surface); color: var(--hs-text); text-align: left;
}
.hs-chip[aria-pressed="true"]{ background: var(--hs-accent); color: var(--hs-accent-text); border-color: transparent; }
.hs-chip-count{ opacity: 0.75; font-weight: 600; }

/* species cards */
.hs-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 12px; }
.hs-card{
  background: var(--hs-surface); border: 1px solid var(--hs-border); border-radius: 18px;
  padding: 14px; display: flex; flex-direction: column; gap: 8px;
}
.hs-card-top{ display: flex; gap: 12px; align-items: flex-start; }
.hs-card-emoji{
  flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--hs-chip);
  display: flex; align-items: center; justify-content: center; font-size: 1.9em; line-height: 1;
}
.hs-card-head{ min-width: 0; }
.hs-card-name{ margin: 0; font-size: 1.15em; line-height: 1.25; }
.hs-sci, .hs-where-line{ margin: 0; color: var(--hs-muted); font-size: 0.9em; }
.hs-meta{ margin: 2px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 0.88em; }
.hs-gems{ letter-spacing: 0.04em; font-size: 1.05em; }
.hs-rarity{ font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.82em; }
.hs-r-common{ color: var(--hs-r-common); }
.hs-r-uncommon{ color: var(--hs-r-uncommon); }
.hs-r-rare{ color: var(--hs-r-rare); }
.hs-r-epic{ color: var(--hs-r-epic); }
.hs-r-legendary{ color: var(--hs-r-legendary); }
.hs-pill{
  display: inline-block; font-size: 0.82em; font-weight: 700; padding: 0.1em 0.6em; border-radius: 999px;
  background: var(--hs-chip); color: var(--hs-text);
}
.hs-pill-invasive{ background: var(--hs-invasive-bg); color: var(--hs-invasive-text); }
.hs-pill-fire{ background: var(--hs-fire-bg); color: var(--hs-fire-text); }
.hs-fact{ margin: 0; }
.hs-more summary{ cursor: pointer; font-weight: 800; color: var(--hs-accent); padding: 4px 0; min-height: 32px; }
.hs-facts{ margin: 6px 0; padding-left: 1.2em; }
.hs-facts li{ margin-bottom: 6px; }
.hs-tell{ margin: 8px 0 2px; }
.hs-help{ margin: 8px 0 0; padding: 0.6em 0.8em; border-radius: 12px; background: var(--hs-good-bg); }
.hs-card-actions{ margin-top: auto; padding-top: 4px; }
.hs-spot{ background: var(--hs-accent); color: var(--hs-accent-text); border-color: transparent; width: 100%; }
.hs-spot.is-spotted{ background: var(--hs-chip); color: var(--hs-r-uncommon); cursor: default; }
.hs-plus{ font-size: 0.85em; opacity: 0.85; }

/* after the fire */
.hs-burn{
  background: var(--hs-surface); border: 1px solid var(--hs-border); border-left: 6px solid var(--hs-warn-edge);
  border-radius: 14px; padding: 12px 14px; margin: 10px 0;
}
.hs-burn h3{ margin: 0; font-size: 1.1em; }
.hs-burn-meta{ margin: 2px 0 6px; color: var(--hs-muted); font-weight: 700; font-size: 0.9em; }
.hs-burn p:last-child{ margin: 0; }
.hs-tiles{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 6px; }
.hs-tile{
  background: var(--hs-surface); border: 1px solid var(--hs-border); border-radius: 16px;
  padding: 12px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px;
}
.hs-tile-num{ font-size: 2em; font-weight: 800; line-height: 1.1; }
.hs-tile-label{ font-size: 0.82em; color: var(--hs-muted); font-weight: 700; }
.hs-section{ margin-top: 14px; border-top: 1px solid var(--hs-border); padding-top: 10px; }
.hs-section summary{ font-weight: 800; cursor: pointer; padding: 6px 0; font-size: 1.05em; }
.hs-section-explain{ margin: 4px 0 10px; color: var(--hs-muted); }

/* plant photo */
.hs-photo-btn{ display: inline-flex; align-items: center; gap: 0.4em; position: relative; }
.hs-tip{ color: var(--hs-muted); margin: 10px 0 0; }
.hs-photo-preview{ display: block; width: 100%; max-width: 240px; border-radius: 16px; margin: 14px 0 10px; }
.hs-id-best{ background: var(--hs-surface); border: 1px solid var(--hs-border); border-radius: 16px; padding: 14px; }
.hs-id-label{ margin: 0; font-weight: 700; color: var(--hs-muted); font-size: 0.9em; }
.hs-id-name{ margin: 2px 0; font-size: 1.4em; font-weight: 800; line-height: 1.2; }
.hs-id-others{ margin: 4px 0 0; padding-left: 1.2em; }

/* badges */
.hs-badges{ margin-top: 24px; border-top: 1px solid var(--hs-border); padding-top: 14px; }
.hs-badges-title{ margin: 0 0 10px; font-size: 1.15em; }
.hs-badge-row{ display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.hs-badge{
  background: var(--hs-surface); border: 1.5px dashed var(--hs-border); border-radius: 16px;
  padding: 10px; text-align: center; display: flex; flex-direction: column; gap: 2px;
}
.hs-badge.is-earned{ border-style: solid; border-color: var(--hs-star); }
.hs-badge-emoji{ font-size: 1.8em; line-height: 1.2; }
.hs-badge-name{ font-weight: 800; }
.hs-badge-how{ font-size: 0.8em; color: var(--hs-muted); }

/* pop-up message for points and badges */
.hs-toast{
  position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 16px);
  width: max-content; /* size to the text instead of being squeezed into half the screen */
  background: var(--hs-accent); color: var(--hs-accent-text); font-weight: 800;
  padding: 0.65em 1.1em; border-radius: 999px; max-width: 90vw; text-align: center; font-size: 0.95em;
  opacity: 0; pointer-events: none; z-index: 9999;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.hs-toast.is-visible{ opacity: 1; transform: translate(-50%, 0); }

/* hidden from eyes but still read by screen readers */
.hs-visually-hidden{
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

@media (max-width: 420px){
  .hs{ padding: 14px; border-radius: 18px; }
  .hs-tab{ font-size: 0.9em; }
  .hs-tile-num{ font-size: 1.6em; }
}
@media (prefers-reduced-motion: reduce){
  .hs-toast, .hs-bar span{ transition: none; }
}

/* ---------- photo mode ("I saw it!" opens this) ---------- */
.hs-modal{ position: fixed; inset: 0; z-index: 9990; display: flex; align-items: flex-end; justify-content: center; }
.hs-modal[hidden]{ display: none; }
.hs-modal-backdrop{ position: absolute; inset: 0; background: rgba(8, 12, 9, 0.62); }
.hs-sheet{
  position: relative; width: min(100%, 520px); max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--hs-bg); color: var(--hs-text); border-radius: 22px 22px 0 0; padding: 18px 18px 22px;
  box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.3);
}
@media (min-width: 600px){ .hs-modal{ align-items: center; } .hs-sheet{ border-radius: 22px; } }
.hs-sheet-head{ display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.hs-sheet-title{ margin: 0; font-size: 1.2em; line-height: 1.25; }
.hs-sheet-text{ margin: 0 0 14px; }
.hs-sheet-actions{ display: grid; gap: 8px; }
.hs-big{ min-height: 56px; font-size: 1.1em; }
.hs-sheet-preview{ display: block; width: 100%; max-height: 34vh; object-fit: contain; background: var(--hs-chip); border-radius: 16px; margin: 0 0 12px; }
.hs-safety-mini{ margin: 14px 0 0; padding: 0.6em 0.8em; border-radius: 12px; background: var(--hs-warn-bg); color: var(--hs-warn-text); font-size: 0.9em; }

/* your own photo on a species card */
.hs-sighting{ position: relative; border-radius: 14px; overflow: hidden; background: var(--hs-chip); aspect-ratio: 4 / 3; }
.hs-sighting img{ display: block; width: 100%; height: 100%; object-fit: cover; }
.hs-sighting-label{ position: absolute; left: 8px; bottom: 8px; background: rgba(0, 0, 0, 0.78); color: #fff; font-size: 0.8em; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.hs-spotted-row{ display: flex; flex-wrap: wrap; gap: 8px; }
.hs-spotted-row .hs-spot{ flex: 1 1 7em; width: auto; }
.hs-retake{ flex: 1 1 auto; }

/* ---------- the Identify button, picker, and collection ---------- */
.hs-identify{ width: 100%; margin-top: 14px; }
.hs-identify-hint{ margin: 6px 0 0; color: var(--hs-muted); font-size: 0.9em; }
.hs-pill-new{ background: var(--hs-good-bg); color: var(--hs-text); }
.hs-pick-label{ display: block; margin: 10px 0 4px; font-weight: 700; }
.hs-id-select, input.hs-id-name{
  width: 100%; min-height: 48px; font: inherit; padding: 0.4em 0.7em; border-radius: 12px;
  border: 1.5px solid var(--hs-border); background: var(--hs-surface); color: var(--hs-text);
}
.hs-id-namebox[hidden]{ display: none; }
.hs-id-error{ margin: 8px 0 0; padding: 0.5em 0.8em; border-radius: 10px; background: var(--hs-warn-bg); color: var(--hs-warn-text); font-weight: 700; }
.hs-pick-actions{ margin-top: 14px; }
.hs-sheet-preview.hs-preview-small{ max-height: 24vh; }
.hs-sheet .hs-id-best{ margin-bottom: 10px; }
.hs-collection-bar{ margin: 4px 0 12px; }

/* "New species identified!" */
.hs-new-species{ background: var(--hs-good-bg); border: 2px solid var(--hs-accent, #3d6b4a); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; color: var(--hs-text); }
.hs-new-species p{ margin: 4px 0; }
.hs-new-species-title{ font-weight: 800; font-size: calc(1.15rem * var(--hs-scale, 1)); }
.hs-new-species .hs-plus{ white-space: nowrap; }

/* toasts move to the top while a sheet is open, so they never cover its buttons */
.hs-modal:not([hidden]) ~ .hs-toast{ top: max(12px, env(safe-area-inset-top)); bottom: auto; transform: translate(-50%, -16px); }
.hs-modal:not([hidden]) ~ .hs-toast.is-visible{ transform: translate(-50%, 0); }

/* "← Back" buttons */
.hs-back{ min-height: 44px; padding: 0.4em 0.9em; background: transparent; border: 1px solid var(--hs-border); color: var(--hs-text); font-weight: 700; border-radius: 999px; text-align: left; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hs-sheet-back{ margin: 0 0 10px; }
.hs-nav-back{ display: block; margin: 12px 0 0; }
.hs-nav-back[hidden], .hs-resume[hidden]{ display: none; }

/* "Finish it": a photo you started but didn't save */
.hs-resume{ display: flex; gap: 12px; align-items: center; margin-top: 10px; padding: 10px; border-radius: 16px; background: var(--hs-chip); border: 1px solid var(--hs-border); }
.hs-resume-thumb{ width: 64px; height: 64px; object-fit: cover; border-radius: 12px; flex: none; }
.hs-resume-body{ flex: 1; min-width: 0; }
.hs-resume-body p{ margin: 0 0 8px; font-weight: 700; }
.hs-resume-actions{ display: flex; flex-wrap: wrap; gap: 8px; }
.hs-resume-actions .hs-btn{ flex: 1 1 7em; min-height: 44px; }

/* ---------- Plant map ---------- */
.hs-map-progress{ margin: 8px 0 0; font-size: 0.9em; font-weight: 700; color: var(--hs-text); }
.hs-map-progress.is-mapped{ color: var(--hs-accent); }
.hs-dots{ letter-spacing: 2px; color: var(--hs-accent); font-size: 1.05em; }
.hs-map{ position: relative; z-index: 0; height: 340px; margin: 12px 0 6px; border-radius: 16px; overflow: hidden; border: 1px solid var(--hs-border); background: var(--hs-chip); }
.hs-map[hidden]{ display: none; }
.hs-map .leaflet-container, .hs-map.leaflet-container{ font: inherit; }
.hs-map-status{ margin: 4px 0 10px; color: var(--hs-muted); font-size: 0.9em; }
.hs-map-h{ margin: 18px 0 8px; font-size: 1.05em; }
.hs-map-list{ list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.hs-map-item{ display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 12px; text-align: left;
  background: var(--hs-surface); color: var(--hs-text); border: 1px solid var(--hs-border); border-radius: 14px; font: inherit; cursor: pointer; }
.hs-map-item:disabled{ cursor: default; opacity: 1; }
.hs-map-item.is-pending{ cursor: default; }
.hs-map-emoji{ font-size: 1.6em; flex: none; }
.hs-map-text{ display: flex; flex-direction: column; min-width: 0; }
.hs-map-text .hs-muted{ margin: 2px 0 0; }
.hs-pin span{ display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 50%;
  background: #ffffff; border: 3px solid #3d6b4a; box-shadow: 0 3px 10px rgba(0,0,0,0.35); font-size: 22px; line-height: 1; }
.hs-map .leaflet-popup-content{ color: #1d261f; font-size: 15px; }
.hs-tabs{ grid-template-columns: repeat(5, 1fr); grid-auto-flow: row; }
@media (max-width: 420px){ .hs-tab{ font-size: 0.8em; padding: 0.3em 0.15em; } }
.hs-tab{ display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.15; }

  What this file does, in plain words:

    1. "What's here"    shows the plants and animals that live in the place you pick.

    2. "After the fire" shows which places burned, and which plants come back first.
    3. "My collection"  everything you have collected, with your own photos.

  Plants are named by Pl@ntNet (needs a free key). Animals can be named by an AI service you plug in.
  Without those, the player picks it from our list or names it themselves.

  Everything comes from the species list in species-data.js, so it works with no internet.
  Points and badges are saved on this device only.

  To put it in a page (README.md explains more):

    <link rel="stylesheet" href="scan.css">
    <div id="habitat-scan"></div>
    <script src="species-data.js"><\/script>
    <script src="scan.js"><\/script>
    <script>
      HabitatScan.mount(document.getElementById("habitat-scan"), {
        plantnetApiKey: "",                    // optional: free key from my.plantnet.org
        mode: "kid",                           // "kid" or "expert" (optional)
        theme: "",                             // "light", "dark", or "" to follow the device
        textScale: 1,                          // 1.2 makes all text 20% bigger

        identifyAnimal: null,                  // optional: function(photoBlob) -> Promise of [{name, scientific, score}]
        animalProviderName: "",                // optional: shown to players, e.g. "Claude"
        onPoints: function(points, reason){},  // optional: send points to the main app
        onBadge: function(badgeIds){}          // optional: tell the main app about new badges
      });
    <\/script>
*/

  // ---------- Posting (shared feed; a grown-up approves every post) ----------
  // Made-up nicknames only (the service accepts nothing else), so no child posts a real name.
  var NICK_ADJ = ["Swift", "Brave", "Quiet", "Clever", "Sunny", "Lucky", "Happy", "Bold", "Gentle", "Curious", "Sharp", "Speedy", "Mighty", "Calm", "Bright", "Wild"];
  var NICK_ANIMAL = ["Coyote", "Hawk", "Owl", "Lizard", "Deer", "Fox", "Quail", "Bobcat", "Jay", "Oak", "Sage", "Poppy", "Toyon", "Yucca", "Raven", "Hummingbird"];
  function randomHex(bytes){
    var a = new Uint8Array(bytes);
    if(window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
    else for(var i = 0; i < bytes; i++) a[i] = Math.floor(Math.random() * 256);
    return Array.prototype.map.call(a, function(x){ return (x < 16 ? "0" : "") + x.toString(16); }).join("");
  }
  function makeNickname(){
    var r = parseInt(randomHex(3), 16);
    return NICK_ADJ[r % 16] + " " + NICK_ANIMAL[Math.floor(r / 16) % 16] + " " + (1 + Math.floor(r / 256) % 99);
  }
  // Personal details kids must not post (the service checks the same things).
  var POST_BLOCK = [
    {re:/\b\d{3}[\s.\-)]*\d{3}[\s.\-]*\d{4}\b/, kid:"a phone number"},
    {re:/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i, kid:"an email address"},
    {re:/(https?:\/\/|www\.|\b[a-z0-9-]+\.(com|net|org|io|me|co|app|gg|tv)\b)/i, kid:"a website link"},
    {re:/\b\d{1,5}\s+([a-z]+\s){0,3}(st|street|ave|avenue|rd|road|dr|drive|blvd|boulevard|ln|lane|way|ct|court|pl|place|terrace|cir|circle)\b/i, kid:"a street address"},
    {re:/\b(my name is|my name's|i am called|call me|i live (at|on|in)|my address|my phone|my school is|i go to [a-z ]*school)\b/i, kid:"your name, school or where you live"},
    {re:/(^|\s)@[a-z0-9_.]{3,}/i, kid:"a username"},
    {re:/\b\d{1,3}\.\d{3,}\s*,\s*-?\d{1,3}\.\d{3,}/, kid:"exact map coordinates"}
  ];
  function postBlockReason(text){
    for(var i = 0; i < POST_BLOCK.length; i++) if(POST_BLOCK[i].re.test(String(text || ""))) return POST_BLOCK[i].kid;
    return null;
  }
  function starsText(rarity){
    var n = Math.max(1, RARITIES.indexOf(rarity) + 1), s = "";
    for(var i = 0; i < 5; i++) s += i < n ? "★" : "☆";
    return s;
  }
  function timeAgo(t){
    var m = Math.round((Date.now() - t) / 60000);
    if(m < 1) return "just now";
    if(m < 60) return m + " min ago";
    var h = Math.round(m / 60);
    if(h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
    var d = Math.round(h / 24);
    return d + (d === 1 ? " day ago" : " days ago");
  }

  // ---------- Saving progress on this device ----------
  var SAVE_KEY = "habitat-scan-v2";

  function blankSave(){
    // sightings: every time a species is photographed -> [{t: time, how: "gps"|"place"|"none", lat, lng, acc, where}]
    return {points:0, spotted:{}, photos:{}, discoveries:[], plants:{}, explored:{}, badges:{}, fireViewed:false, mode:"kid", sightings:{}, myPosts:[], nickname:"", deviceId:""};
  }
  function loadSave(){
    try{
      var raw = window.localStorage.getItem(SAVE_KEY);
      if(raw) return Object.assign(blankSave(), JSON.parse(raw));
    }catch(err){ /* storage is blocked (some previews do this), so start fresh */ }
    return blankSave();
  }
  function writeSave(save){
    try{ window.localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
    catch(err){ /* can't save here; the game still works, it just won't remember */ }
  }

  // ---------- Small helpers ----------
  function escapeHtml(value){
    return String(value == null ? "" : value).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c];
    });
  }
  function plural(n, word){ return n + " " + word + (n === 1 ? "" : "s"); }
  // Today's date as YYYY-MM-DD.
  function today(){
    var d = new Date(), m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }
  // Picks the kid wording or the expert wording.
  function T(kid, kidText, expertText){ return kid ? kidText : expertText; }

  // ---------- The data: areas, places (zones), and species ----------
  function getData(options){
    var d = options.data || window.HabitatScanData;
    if(!d || !d.areas || !d.zones || !d.species){
      throw new Error("Explore nearby needs the species data. Load species-data.js before scan.js, or pass { data: { areas, zones, species } } to mount().");
    }
    return d;
  }
  // Lookup tables so we can find things by id quickly.
  function buildIndex(data){
    var idx = {areasById:{}, zonesById:{}, speciesById:{}, zonesByArea:{}};
    data.areas.forEach(function(a){ idx.areasById[a.id] = a; idx.zonesByArea[a.id] = []; });
    data.zones.forEach(function(z){
      idx.zonesById[z.id] = z;
      if(!idx.zonesByArea[z.area]) idx.zonesByArea[z.area] = [];
      idx.zonesByArea[z.area].push(z);
    });
    data.species.forEach(function(s){ idx.speciesById[s.id] = s; });
    return idx;
  }
  function areaEmoji(area, idx){
    if(area.emoji) return area.emoji;
    var zones = idx.zonesByArea[area.id] || [];
    return zones.length ? zones[0].emoji : "📍";
  }

  // A "place" is either a whole area ({kind:"area", id}) or one spot inside it ({kind:"zone", id}).
  function placeZones(idx, place){
    if(!place) return [];
    if(place.kind === "zone") return idx.zonesById[place.id] ? [idx.zonesById[place.id]] : [];
    return idx.zonesByArea[place.id] || [];
  }
  function placeAreaId(idx, place){
    if(!place) return null;
    return place.kind === "zone" ? (idx.zonesById[place.id] || {}).area : place.id;
  }
  function placeName(idx, place){
    if(!place) return "";
    if(place.kind === "zone"){ var z = idx.zonesById[place.id]; return z ? z.name : ""; }
    var a = idx.areasById[place.id]; return a ? a.name : "";
  }
  function speciesForPlace(data, idx, place){
    var ids = {};
    placeZones(idx, place).forEach(function(z){ ids[z.id] = true; });
    return data.species.filter(function(s){ return ids[s.zone]; });
  }
  function burnedZones(idx, place){
    return placeZones(idx, place).filter(function(z){ return z.fireHistory; });
  }

  // Which of our places is closest to a spot on Earth (distance in miles)?
  function milesBetween(lat1, lng1, lat2, lng2){
    var R = 3958.8, rad = Math.PI / 180;
    var dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  function nearestZone(zones, lat, lng){
    var best = null, bestMiles = Infinity;
    zones.forEach(function(z){
      if(typeof z.lat !== "number" || typeof z.lng !== "number") return;
      var miles = milesBetween(lat, lng, z.lat, z.lng);
      if(miles < bestMiles){ best = z; bestMiles = miles; }
    });
    return best ? {zone:best, miles:bestMiles} : null;
  }

  // Sorts a place's species into the three fire stories.
  function fireGroups(list){
    var followers = [], adapted = [], invasive = [];
    list.forEach(function(s){
      if(s.status === "Fire Follower") followers.push(s);
      else if(s.status === "Fire-Adapted" || s.fireFollower === true) adapted.push(s);
      else if(s.status === "Invasive") invasive.push(s);
    });
    return {followers:followers, adapted:adapted, invasive:invasive};
  }

  // Safety message for a place: the area's own notice if it has one, else a burn warning.
  function safetyFor(idx, place){
    if(!place) return null;
    var area = idx.areasById[placeAreaId(idx, place)];
    if(area && area.notice){
      return {level: area.notice.tone === "closed" ? "closed" : "care", title: area.notice.title, text: area.notice.text};
    }
    if(burnedZones(idx, place).length){
      return {level:"care", title:"Stay safe",
        text:"Burned hills can have falling rocks and mudslides, especially after rain. Stay on open trails and go with a grown-up."};
    }
    return null;
  }

  // Checks a plant name from Pl@ntNet against our own plants.
  function genusSpecies(name){
    return String(name || "").toLowerCase().replace(/[^a-z\s-]/g, " ").replace(/\s+/g, " ").trim().split(" ").slice(0, 2).join(" ");
  }
  function matchLocalPlant(list, scientificName){
    var target = genusSpecies(scientificName), genus = target.split(" ")[0];
    var exact = null, relatives = [];
    list.forEach(function(s){
      if(s.type !== "plant") return;
      var gs = genusSpecies(s.latin);
      if(gs && gs === target) exact = s;
      else if(genus && gs.split(" ")[0] === genus) relatives.push(s);
    });
    return {exact:exact, relatives:relatives};
  }

  // ---------- Pieces of HTML (these are plain functions, so they are easy to test) ----------
  function gemsHtml(rarity){
    var n = RARITIES.indexOf(rarity) + 1;
    if(n < 1){ n = 1; rarity = "Common"; }
    var stars = "";
    for(var i = 0; i < 5; i++) stars += i < n ? "★" : "☆";
    return '<span class="hs-gems hs-r-' + rarity.toLowerCase() + '" role="img" aria-label="' + escapeHtml(rarity) + ', ' + n + ' of 5">' + stars + '</span> ' +
      '<span class="hs-rarity hs-r-' + rarity.toLowerCase() + '">' + escapeHtml(rarity) + '</span>';
  }
  function statusPillHtml(status){
    if(!status || status === "Stable") return "";
    var cls = "hs-pill";
    if(status === "Invasive") cls += " hs-pill-invasive";
    else if(status === "Fire Follower" || status === "Fire-Adapted") cls += " hs-pill-fire";
    return '<span class="' + cls + '">' + escapeHtml(status) + '</span>';
  }
  // Map status on a card: "On your map!" once it has been spotted.
  function sightingCount(save, key){ return ((save.sightings || {})[key] || []).length; }
  function dotsHtml(n){
    var s = "";
    for(var i = 0; i < MAP_NEEDS; i++) s += i < n ? "●" : "○";
    return '<span class="hs-dots" aria-hidden="true">' + s + '</span>';
  }
  function mapProgressHtml(save, key, kid){
    var n = sightingCount(save, key);
    if(!n) return "";
    if(n >= MAP_NEEDS) return '<p class="hs-map-progress is-mapped">🗺️ ' + T(kid, "On your map!" + (n > 1 ? " Spotted " + n + " times." : ""), "Mapped · " + n + (n === 1 ? " sighting" : " sightings")) + '</p>';
    var left = MAP_NEEDS - n;
    return '<p class="hs-map-progress">' + dotsHtml(n) + ' ' +
      T(kid, "Spot it " + left + " more " + (left === 1 ? "time" : "times") + " to put it on your map", n + " of " + MAP_NEEDS + " sightings needed to map") + '</p>';
  }

  // "I saw it!" opens the photo mode. Once a species is spotted, the button turns into Spotted + Retake
  // ("Saw it again": every photo adds a sighting to the map).
  function spotButtonHtml(id, save, kid, name, type){
    var safeId = escapeHtml(id);
    var hasPhoto = !!(save.photos && save.photos[id]);
    if(save.spotted[id]){
      return '<div class="hs-spotted-row"><button type="button" class="hs-btn hs-spot is-spotted" data-id="' + safeId + '" disabled>✓ Spotted</button>' +
        '<button type="button" class="hs-btn hs-retake" data-id="' + safeId + '" aria-label="' +
          escapeHtml("Saw it again: photograph " + (name || "this species")) + '">📷 ' +
          T(kid, "Saw it again", "Log again") + '</button></div>';
    }
    return '<button type="button" class="hs-btn hs-spot" data-id="' + safeId + '">📷 ' +
      T(kid, "I saw it!", "Log sighting") + ' <span class="hs-plus">+' + POINTS.spot + '</span></button>';
  }
  // The player's own photo, shown on the card. The picture itself is loaded after the card is drawn.
  function sightingHtml(sp, ctx){
    if(!ctx.save.photos || !ctx.save.photos[sp.id]) return "";
    return '<div class="hs-sighting" data-photo-id="' + escapeHtml(sp.id) + '"><img hidden alt="' + escapeHtml("Your photo of the " + sp.name) + '">' +
      '<span class="hs-sighting-label">📷 Your photo</span></div>';
  }
  function progressInner(ctx){
    var all = speciesForPlace(ctx.data, ctx.idx, ctx.place);
    var n = all.filter(function(s){ return ctx.save.spotted[s.id]; }).length;
    var pct = all.length ? Math.round(n / all.length * 100) : 0;
    return '<div class="hs-bar" role="img" aria-label="' + pct + ' percent spotted"><span style="width:' + pct + '%"></span></div>' +
      '<p class="hs-muted">' + T(ctx.kid, "You've spotted " + n + " of " + all.length + " here", n + " of " + all.length + " spotted in this place") + '</p>';
  }

  // One species card. The first fact is always shown; the rest is tucked into "Tell me more".
  function cardHtml(sp, ctx, showZone){
    var kid = ctx.kid;
    var zone = ctx.idx.zonesById[sp.zone];
    var facts = sp.facts || [];
    var more = "";
    if(facts.length > 1){
      more += '<ul class="hs-facts">' + facts.slice(1).map(function(f){ return '<li>' + escapeHtml(f) + '</li>'; }).join("") + '</ul>';
    }
    if(!kid && sp.howToTell) more += '<p class="hs-tell"><strong>How to tell:</strong> ' + escapeHtml(sp.howToTell) + '</p>';
    if(!kid && sp.habitatFor && sp.habitatFor.length){
      more += '<p class="hs-tell"><strong>Habitat for:</strong></p><ul class="hs-facts">' +
        sp.habitatFor.map(function(h){ return '<li>' + escapeHtml(h) + '</li>'; }).join("") + '</ul>';
    }
    if(sp.help) more += '<p class="hs-help">💚 <strong>' + T(kid, "How you can help", "Stewardship") + ':</strong> ' + escapeHtml(sp.help) + '</p>';
    return '<article class="hs-card" data-id="' + escapeHtml(sp.id) + '" data-showzone="' + (showZone ? "1" : "0") + '">' +
      '<div class="hs-card-top">' +
        '<span class="hs-card-emoji" aria-hidden="true">' + escapeHtml(sp.emoji || "✨") + '</span>' +
        '<div class="hs-card-head">' +
          '<h3 class="hs-card-name">' + escapeHtml(sp.name) + '</h3>' +
          (kid ? '' : '<p class="hs-sci"><i>' + escapeHtml(sp.latin) + '</i></p>') +
          '<p class="hs-meta">' + gemsHtml(sp.rarity) + ' ' + statusPillHtml(sp.status) + '</p>' +
          (showZone && zone ? '<p class="hs-where-line">📍 ' + escapeHtml(zone.name) + '</p>' : '') +
        '</div>' +
      '</div>' +
      sightingHtml(sp, ctx) +
      mapProgressHtml(ctx.save, sp.id, kid) +
      (facts[0] ? '<p class="hs-fact">' + escapeHtml(facts[0]) + '</p>' : '') +
      (more ? '<details class="hs-more"' + (kid ? '' : ' open') + '><summary>' + T(kid, "Tell me more", "Details") + '</summary>' + more + '</details>' : '') +
      '<div class="hs-card-actions">' + spotButtonHtml(sp.id, ctx.save, kid, sp.name, sp.type) + '</div>' +
    '</article>';
  }

  function chipsHtml(all, group){
    return '<div class="hs-chips" role="group" aria-label="Show a group">' + GROUPS.map(function(g){
      var count = all.filter(function(s){ return !g.type || s.type === g.type; }).length;
      return '<button type="button" class="hs-chip" data-group="' + g.id + '" aria-pressed="' + (group === g.id) + '">' +
        g.emoji + " " + g.label + ' <span class="hs-chip-count">' + count + '</span></button>';
    }).join("") + '</div>';
  }
  function findGroup(id){
    for(var i = 0; i < GROUPS.length; i++){ if(GROUPS[i].id === id) return GROUPS[i]; }
    return GROUPS[0];
  }
  // Species you have not spotted come first, then the rarer ones.
  function sortForDisplay(list, save){
    return list.slice().sort(function(a, b){
      var sa = save.spotted[a.id] ? 1 : 0, sb = save.spotted[b.id] ? 1 : 0;
      if(sa !== sb) return sa - sb;
      var ra = RARITIES.indexOf(b.rarity) - RARITIES.indexOf(a.rarity);
      if(ra) return ra;
      return String(a.name).localeCompare(String(b.name));
    });
  }
  function sourceHtml(kid){
    return '<p class="hs-source">' + T(kid,
      "These facts were written for Habitat Trail and are still being fact-checked. If something looks wrong, tell a grown-up on the team!",
      "Species information was written for Habitat Trail and is still being fact-checked against public sources. Corrections welcome.") + '</p>';
  }

  function promptHtml(kid){
    return '<div class="hs-prompt"><p class="hs-prompt-emoji" aria-hidden="true">👆</p><p>' +
      T(kid, "Pick a place above to see who lives there!", "Choose a place above to list its species.") + '</p></div>';
  }

  function hereHtml(ctx){
    var kid = ctx.kid;
    var all = speciesForPlace(ctx.data, ctx.idx, ctx.place);
    var group = findGroup(ctx.group);
    var list = all.filter(function(s){ return !group.type || s.type === group.type; });
    var name = escapeHtml(placeName(ctx.idx, ctx.place));
    var area = ctx.idx.areasById[placeAreaId(ctx.idx, ctx.place)];
    var html = '<p class="hs-intro">' + T(kid,
      "Here's who lives in <strong>" + name + "</strong>. Tap \"I saw it!\" when you spot one.",
      plural(all.length, "species") + " in our list for <strong>" + name + "</strong>.") + '</p>';
    if(ctx.place.kind === "area" && area && area.blurb) html += '<p class="hs-muted hs-blurb">' + escapeHtml(area.blurb) + '</p>';
    html += '<div class="hs-progress">' + progressInner(ctx) + '</div>';
    html += chipsHtml(all, ctx.group);
    if(!list.length){
      html += '<div class="hs-note">' + T(kid, "Nothing listed here yet.", "No species in this group for this place.") + '</div>';
    } else {
      html += '<div class="hs-grid">' + sortForDisplay(list, ctx.save).map(function(sp){
        return cardHtml(sp, ctx, ctx.place.kind === "area");
      }).join("") + '</div>';
    }
    return html + sourceHtml(kid);
  }

  function sectionHtml(icon, title, explain, list, ctx){
    if(!list.length) return "";
    return '<details class="hs-section" open><summary>' + icon + ' ' + title + ' <span class="hs-muted">(' + list.length + ')</span></summary>' +
      '<p class="hs-section-explain">' + explain + '</p>' +
      '<div class="hs-grid">' + sortForDisplay(list, ctx.save).map(function(sp){ return cardHtml(sp, ctx, ctx.place.kind === "area"); }).join("") + '</div></details>';
  }

  function fireHtml(ctx){
    var kid = ctx.kid;
    var all = speciesForPlace(ctx.data, ctx.idx, ctx.place);
    var burned = burnedZones(ctx.idx, ctx.place);
    var g = fireGroups(all);
    var name = escapeHtml(placeName(ctx.idx, ctx.place));
    var html = '<p class="hs-intro">' + T(kid,
      "Fires burn a lot, but nature grows back. Here's what happened in <strong>" + name + "</strong> and who helps it recover.",
      "Recorded fires and fire-response species for <strong>" + name + "</strong>.") + '</p>';

    if(burned.length){
      html += burned.map(function(z){
        var f = z.fireHistory;
        return '<div class="hs-burn"><h3>🔥 ' + escapeHtml(z.name) + '</h3>' +
          '<p class="hs-burn-meta">' + escapeHtml(f.name) + ' · ' + escapeHtml(f.year) + (f.acres ? ' · ' + escapeHtml(f.acres) : '') + '</p>' +
          '<p>' + escapeHtml(f.note) + '</p></div>';
      }).join("");
    } else {
      var other = ctx.data.zones.filter(function(z){ return z.fireHistory && /eaton/i.test(z.fireHistory.name); })[0] ||
                  ctx.data.zones.filter(function(z){ return z.fireHistory; })[0];
      html += '<div class="hs-note"><p>' + T(kid,
        "No fire is recorded here in our list. Burned places are fun to compare!",
        "No fire history in our data for this place. Burned places make a useful comparison.") + '</p>' +
        (other ? '<button type="button" class="hs-btn hs-go-burn" data-zone="' + escapeHtml(other.id) + '">🔥 Show ' + escapeHtml(other.name) + '</button>' : '') + '</div>';
    }

    html += '<div class="hs-tiles">' +
      '<div class="hs-tile"><span class="hs-tile-num">' + g.followers.length + '</span><span class="hs-tile-label">Fire followers</span></div>' +
      '<div class="hs-tile"><span class="hs-tile-num">' + g.adapted.length + '</span><span class="hs-tile-label">' + T(kid, "Fire survivors", "Fire-adapted") + '</span></div>' +
      '<div class="hs-tile"><span class="hs-tile-num">' + g.invasive.length + '</span><span class="hs-tile-label">' + T(kid, "Watch for", "Invasive") + '</span></div>' +
    '</div>';

    var sections =
      sectionHtml("🌱", "Fire followers",
        T(kid, "Their seeds can wait in the soil for years. After a fire, they wake up and sprout!",
               "Seeds germinate after fire cues such as heat, smoke, or cleared ground, often blooming heavily the first spring."), g.followers, ctx) +
      sectionHtml("🔥", T(kid, "Fire survivors", "Fire-adapted"),
        T(kid, "These can handle fire. Many sprout new shoots from roots that were safe underground.",
               "Resprout from roots or have bark and seeds built to survive fire."), g.adapted, ctx) +
      sectionHtml("⚠️", T(kid, "Watch for these", "Invasive species"),
        T(kid, "Burned ground is wide open. Plants from other places can move in fast and crowd out the natives.",
               "Non-native species can colonize burned, disturbed ground and compete with recovering natives."), g.invasive, ctx);
    html += sections || '<div class="hs-note">' + T(kid, "No fire-recovery species are listed for this place yet.", "No fire-response species listed for this place.") + '</div>';

    html += '<p class="hs-safety-line">⚠️ ' + T(kid,
      "Never go into burned or closed areas. Explore them from home right here instead.",
      "Don't enter burn scars or closed areas; rockfall and debris flows are common, especially after rain.") + '</p>';
    return html + sourceHtml(kid);
  }

  // ---------- Names, matching, and the collection ----------
  function sanitizeName(value){
    return String(value == null ? "" : value).replace(/[\u0000-\u001f\u007f]/g, " ").replace(/\s+/g, " ").trim().slice(0, 40);
  }
  function normName(value){
    return String(value || "").toLowerCase().replace(/[^a-z\s]/g, " ").replace(/\s+/g, " ").trim();
  }
  // Finds one of our species from a scientific name (the best clue) or a common name.
  function matchLocal(list, type, scientific, name){
    var target = genusSpecies(scientific), genus = target.split(" ")[0], nm = normName(name), exact = null;
    list.forEach(function(s){ if(s.type === type && target && genusSpecies(s.latin) === target) exact = s; });
    if(!exact && nm) list.forEach(function(s){ if(s.type === type && normName(s.name) === nm) exact = s; });
    var relatives = list.filter(function(s){
      return s.type === type && s !== exact && genus && genusSpecies(s.latin).split(" ")[0] === genus;
    });
    return {exact:exact, relatives:relatives};
  }
  // Has this player already added a discovery like this one?
  function findDiscovery(discoveries, type, scientific, name){
    var sci = genusSpecies(scientific), nm = normName(name);
    for(var i = 0; i < discoveries.length; i++){
      var d = discoveries[i];
      if(d.type !== type) continue;
      if(sci && genusSpecies(d.scientific) === sci) return d;
      if(nm && normName(d.name) === nm) return d;
    }
    return null;
  }

  // What the player wrote about a species the app doesn't know (where, how rare they think, facts).
  function notesHtml(d, kid, full){
    var n = d.notes;
    if(!n || (!n.where && !n.rarity && !n.facts)) return "";
    var r = n.rarity && RARITIES.indexOf(n.rarity) >= 0 ? n.rarity : "";
    var facts = String(n.facts || "");
    if(!full && facts.length > 140) facts = facts.slice(0, 137).replace(/\s+\S*$/, "") + "…";
    return '<div class="hs-notes"><p class="hs-notes-title">✏️ ' + T(kid, "What you know", "Your notes") + '</p>' +
      (n.where ? '<p>📍 <strong>' + T(kid, "Where:", "Location:") + '</strong> ' + escapeHtml(n.where) + '</p>' : '') +
      (r ? '<p><strong>' + T(kid, "How rare you think:", "Your rarity guess:") + '</strong> ' + gemsHtml(r) + '</p>' : (n.rarity === "unsure" ? '<p><strong>' + T(kid, "How rare:", "Rarity:") + '</strong> ' + T(kid, "not sure yet", "unknown") + '</p>' : '')) +
      (facts ? '<p class="hs-notes-facts">' + escapeHtml(facts) + '</p>' : '') + '</div>';
  }
  // A card for something the player found that is not on our species list.
  function discoveryCardHtml(d, ctx){
    var kid = ctx.kid;
    var icon = d.type === "plant" ? "🌿" : "🐾";
    var src = d.source === "plantnet" ? "Pl@ntNet" : (d.source === "ai" ? "AI" : T(kid, "named by you", "named by the player"));
    return '<article class="hs-card hs-card-disc" data-disc="' + escapeHtml(d.id) + '">' +
      '<div class="hs-card-top"><span class="hs-card-emoji" aria-hidden="true">' + icon + '</span><div class="hs-card-head">' +
        '<h3 class="hs-card-name">' + escapeHtml(d.name) + '</h3>' +
        (!kid && d.scientific ? '<p class="hs-sci"><i>' + escapeHtml(d.scientific) + '</i></p>' : '') +
        '<p class="hs-meta"><span class="hs-pill hs-pill-new">🆕 ' + T(kid, "New species", "New species") + '</span> <span class="hs-muted">' + escapeHtml(src) + '</span></p>' +
      '</div></div>' +
      (d.photo ? '<div class="hs-sighting" data-photo-id="d-' + escapeHtml(d.id) + '"><img hidden alt="' + escapeHtml("Your photo of " + d.name) + '"><span class="hs-sighting-label">📷 Your photo</span></div>' : '') +
      '<p class="hs-fact">' + T(kid, "You found this one! It isn't in any of our places yet.", "Not in any area's species list.") + ' <span class="hs-muted">(' + escapeHtml(d.date || "") + ')</span></p>' +
      notesHtml(d, kid, false) +
      mapProgressHtml(ctx.save, "d-" + d.id, kid) +
      '<div class="hs-card-actions"><button type="button" class="hs-btn hs-notes-open" data-disc="' + escapeHtml(d.id) + '">✏️ ' +
        (d.notes ? T(kid, "Edit what you know", "Edit notes") : T(kid, "Add what you know", "Add notes")) + '</button></div>' +
    '</article>';
  }

  // The "My collection" tab: every species the player has photographed, plus their own discoveries.
  function collectionHtml(ctx){
    var kid = ctx.kid, data = ctx.data, save = ctx.save;
    var group = findGroup(ctx.group);
    var discs = save.discoveries || [];
    var spotted = data.species.filter(function(s){ return save.spotted[s.id]; });
    var inGroup = function(item){ return !group.type || item.type === group.type; };
    var shownSpecies = spotted.filter(inGroup).sort(function(a, b){
      var da = String(save.spotted[a.id]), db = String(save.spotted[b.id]);
      if(da !== db) return da < db ? 1 : -1;
      return String(a.name).localeCompare(String(b.name));
    });
    var shownDiscs = discs.filter(inGroup).slice().sort(function(a, b){ return (b.added || 0) - (a.added || 0); });
    var total = data.species.length, n = spotted.length, pct = total ? Math.round(n / total * 100) : 0;
    var dWord = "new species";
    var html = '<p class="hs-intro">' + T(kid,
      "Everything you've collected! You have <strong>" + n + "</strong> of our " + total + " species and <strong>" + discs.length + "</strong> " + dWord + ".",
      n + " of " + total + " species · " + discs.length + " " + dWord + ".") + '</p>' +
      '<div class="hs-collection-bar"><div class="hs-bar" role="img" aria-label="' + pct + ' percent of species collected"><span style="width:' + pct + '%"></span></div></div>' +
      chipsHtml(spotted.concat(discs), ctx.group);
    if(!shownSpecies.length && !shownDiscs.length){
      html += '<div class="hs-note">' + (spotted.length || discs.length
        ? T(kid, "Nothing in this group yet.", "No items in this group.")
        : T(kid, "Nothing here yet! Tap <strong>Identify</strong> or <strong>I saw it!</strong> to start your collection.",
                 "Empty. Use Identify or Log sighting to add items.")) + '</div>';
    } else {
      html += '<div class="hs-grid">' + shownDiscs.map(function(d){ return discoveryCardHtml(d, ctx); }).join("") +
        shownSpecies.map(function(sp){ return cardHtml(sp, ctx, true); }).join("") + '</div>';
    }
    return html + sourceHtml(kid);
  }

  // The dropdown + name box used when the player picks (or names) the species themselves.
  function pickerHtml(ctx, im, titleId){
    var kid = ctx.kid, kind = im.kind;
    var pick = im.pick || {value:"", name:"", error:""};
    var options = ctx.data.species.filter(function(s){ return s.type === kind; }).sort(function(a, b){ return String(a.name).localeCompare(String(b.name)); });
    var nearIds = {};
    if(im.near && im.near.zoneId) ctx.data.species.forEach(function(s){ if(s.zone === im.near.zoneId && s.type === kind) nearIds[s.id] = true; });
    var nearOpts = options.filter(function(s){ return nearIds[s.id]; });
    var optHtml = function(s){
      return '<option value="' + escapeHtml(s.id) + '"' + (pick.value === s.id ? ' selected' : '') + '>' + escapeHtml((s.emoji || "") + " " + s.name) + '</option>';
    };
    var selId = titleId + "-select", nameId = titleId + "-name";
    return '<label class="hs-pick-label" for="' + escapeHtml(selId) + '">' + T(kid, "Which one is it?", "Select the species") + '</label>' +
      '<select class="hs-id-select" id="' + escapeHtml(selId) + '"><option value="">' + T(kid, "Pick one…", "Choose…") + '</option>' +
      (nearOpts.length
        ? '<optgroup label="' + escapeHtml(T(kid, "Near you: ", "Near ") + im.near.zoneName) + '">' + nearOpts.map(optHtml).join("") + '</optgroup>' +
          '<optgroup label="' + T(kid, "All of them", "All species") + '">' + options.map(optHtml).join("") + '</optgroup>'
        : options.map(optHtml).join("")) +
      '<option value="__other__"' + (pick.value === "__other__" ? ' selected' : '') + '>✏️ ' + T(kid, "Something else (I'll name it)", "Not listed (enter a name)") + '</option></select>' +
      '<div class="hs-id-namebox"' + (pick.value === "__other__" ? '' : ' hidden') + '><label class="hs-pick-label" for="' + escapeHtml(nameId) + '">' + T(kid, "What do you call it?", "Name") + '</label>' +
      '<input type="text" class="hs-id-name" id="' + escapeHtml(nameId) + '" maxlength="40" autocomplete="off" value="' + escapeHtml(pick.name || "") + '" placeholder="' + T(kid, "Type a name", "e.g. Gray squirrel") + '"></div>' +
      (pick.error ? '<p class="hs-id-error" role="alert">' + escapeHtml(pick.error) + '</p>' : '');
  }

  // "Plants you might see here": shown on the Identify sheet before the camera opens.
  // near.status: "loading" | "in" (close to one of our places) | "out" (too far) | "place" (no GPS, using the picked place) | "none"
  function nearHtml(ctx, im){
    var kid = ctx.kid, near = im.near;
    if(!near || near.status === "none") return near && near.hint ? '<p class="hs-near-hint">📍 ' + escapeHtml(near.hint) + '</p>' : '';
    if(near.status === "loading") return '<p class="hs-near-hint">📍 ' + T(kid, "Checking which plants grow near you…", "Locating…") + '</p>';
    if(near.status === "out"){
      return '<div class="hs-near hs-near-out" role="status"><p><strong>📍 ' + T(kid, "You're not in range of our area.", "Out of range.") + '</strong> ' +
        T(kid, "You're about " + near.miles.toFixed(1) + " miles from our closest place, " + escapeHtml(near.zone.name) + ". You can still take a photo of anything you find!",
               "Nearest place: " + escapeHtml(near.zone.name) + " (" + near.miles.toFixed(1) + " mi). Identification still works.") + '</p></div>';
    }
    var list = near.plants || [];
    if(!list.length) return '';
    var shown = list.slice(0, 8);
    var title = near.status === "place"
      ? T(kid, "Plants at " + escapeHtml(near.zoneName) + " (the place you picked)", "Plants at " + escapeHtml(near.zoneName))
      : T(kid, "Plants you might see near " + escapeHtml(near.zoneName), "Plants recorded near " + escapeHtml(near.zoneName));
    return '<div class="hs-near" role="region" aria-label="' + escapeHtml(title.replace(/<[^>]*>/g, "")) + '">' +
      '<p class="hs-near-title">🌿 ' + title + '</p>' +
      '<p class="hs-near-sub">' + T(kid, "Know which one it is? Tap it to photograph it.", "Select one to log it directly.") + '</p>' +
      '<div class="hs-near-list">' + shown.map(function(sp){
        var got = ctx.save.spotted[sp.id];
        return '<button type="button" class="hs-near-plant' + (got ? ' is-got' : '') + '" data-id="' + escapeHtml(sp.id) + '">' +
          '<span aria-hidden="true">' + escapeHtml(sp.emoji || "🌿") + '</span> ' + escapeHtml(sp.name) +
          (got ? ' <span class="hs-near-got">✓<span class="hs-visually-hidden"> spotted</span></span>' : (RARITIES.indexOf(sp.rarity) >= 2 ? ' <span class="hs-near-rare">★<span class="hs-visually-hidden"> ' + escapeHtml(sp.rarity) + '</span></span>' : '')) +
          '</button>';
      }).join("") + '</div>' +
      (list.length > shown.length ? '<p class="hs-near-sub">' + T(kid, "+" + (list.length - shown.length) + " more on What's here", "+" + (list.length - shown.length) + " more") + '</p>' : '') +
      '</div>';
  }

  // The Identify sheet. im.stage is "choose", "working", "preview", "identifying", "result", "pick" or "error".
  function identifySheetHtml(ctx, im, titleId){
    var kid = ctx.kid;
    var head = (im.canBack ? '<button type="button" class="hs-btn hs-back hs-sheet-back">← Back</button>' : '') + '<div class="hs-sheet-head"><span class="hs-card-emoji" aria-hidden="true">📷</span><div>' +
      '<h3 class="hs-sheet-title" id="' + escapeHtml(titleId) + '">Identify a plant or animal</h3></div></div>';
    var cancel = '<button type="button" class="hs-btn hs-sheet-cancel">Cancel</button>';
    var chooseButtons =
      '<button type="button" class="hs-btn hs-btn-primary hs-big hs-open-camera">📷 Open camera</button>' +
      '<button type="button" class="hs-btn hs-open-library">🖼️ ' + T(kid, "Use a photo I already took", "Choose an existing photo") + '</button>';
    var pic = function(small){
      return im.previewUrl ? '<img class="hs-sheet-preview' + (small ? ' hs-preview-small' : '') + '" src="' + escapeHtml(im.previewUrl) + '" alt="Your photo">' : '';
    };
    var plantnetLink = '<a href="https://plantnet.org" target="_blank" rel="noopener">Pl@ntNet</a>';

    if(im.stage === "working"){
      return head + '<p class="hs-loading">' + (im.msg || "🔭 " + T(kid, "Getting your photo ready…", "Processing photo…")) + '</p>';
    }
    if(im.stage === "identifying"){
      return head + pic(true) + '<p class="hs-loading">🔭 ' + T(kid, "Looking closely…", "Identifying…") + '</p>';
    }
    if(im.stage === "error"){
      return head + '<div class="hs-note hs-note-warn"><p>' + T(kid, "Hmm, we couldn't open that photo. Try Open camera instead. If you're looking at the app inside another app, open your website link in Safari.",
            "That file couldn't be opened as a photo. Use the camera, or open the app's link directly in Safari.") + '</p></div>' +
        '<div class="hs-sheet-actions">' + chooseButtons + cancel + '</div>';
    }
    if(im.stage === "preview"){
      return head + pic(false) + '<p class="hs-sheet-text">' + T(kid, "What is it?", "Select the type of organism.") + '</p>' +
        '<div class="hs-sheet-actions">' +
          '<button type="button" class="hs-btn hs-btn-primary hs-big hs-id-kind" data-kind="plant">🌿 ' + T(kid, "It's a plant", "Plant") + '</button>' +
          '<button type="button" class="hs-btn hs-btn-primary hs-big hs-id-kind" data-kind="animal">🐾 ' + T(kid, "It's an animal", "Animal") + '</button>' +
          '<button type="button" class="hs-btn hs-open-camera">📷 ' + T(kid, "Take another", "Retake") + '</button>' + cancel +
        '</div>' +
        (im.plantnetOn ? '<p class="hs-source">' + T(kid, "Plants are named by ", "Plant identification by ") + plantnetLink + T(kid, " (your photo is sent there).", ". The photo is sent to Pl@ntNet.") + '</p>'
          : (im.plantAi ? '<p class="hs-source">' + T(kid, "Plants are named by ", "Plant identification by ") + escapeHtml(im.aiName || "an AI service") + T(kid, " (your photo is sent there).", ". The photo is sent to that service.") + '</p>' : '')) +
        (im.animalAi ? '<p class="hs-source">' + T(kid, "Animals are named by ", "Animal identification by ") + escapeHtml(im.aiName || "an AI service") + T(kid, " (your photo is sent there).", ". The photo is sent to that service.") + '</p>' : '');
    }
    var aiCredit = function(a){
      if(a.source === "plantnet") return '<p class="hs-source">Plant ID by ' + plantnetLink + '.</p>';
      if(a.source === "ai") return '<p class="hs-source">' + T(kid, (im.kind === "plant" ? "Plant" : "Animal") + " ID by ", "Identification by ") + escapeHtml(im.aiName || "an AI service") + '.</p>';
      return '';
    };
    var safety = function(){
      return im.kind === "plant"
        ? '<p class="hs-safety-mini">⚠️ ' + T(kid, "A name from an app is only a guess. Never taste or eat a wild plant, and don't touch ones you don't know.", "Identifications are estimates. Never eat or handle unidentified wild plants.") + '</p>'
        : '<p class="hs-safety-mini">⚠️ ' + T(kid, "A name from an app is only a guess. Keep your distance from wild animals.", "Identifications are estimates. Keep your distance from wildlife.") + '</p>';
    };
    if(im.stage === "added" && im.added){
      return head + pic(true) + '<div class="hs-note hs-note-good" role="status"><p><strong>✓ ' + escapeHtml(im.added.name) + '</strong> ' +
          T(kid, "is in your collection and on your map!", "added to your collection.") + '</p><p>' + T(kid, "Want to share it with other explorers?", "Share it?") + '</p></div>' +
        '<div class="hs-sheet-actions">' +
          '<button type="button" class="hs-btn hs-btn-primary hs-big hs-post-open" data-key="' + escapeHtml(im.added.key) + '">📣 ' + T(kid, "Post it for everyone", "Post it") + '</button>' +
          '<button type="button" class="hs-btn hs-id-done">' + T(kid, "Not now", "Done") + '</button></div>';
    }
    // Something the AI named that is in none of our areas: it is already in the collection.
    if(im.stage === "newSpecies" && im.ai){
      var n = im.ai;
      return head + pic(true) +
        '<div class="hs-new-species" role="status">' +
          '<p class="hs-new-species-title">🆕 ' + T(kid, "New species identified!", "New species identified") + '</p>' +
          '<p class="hs-id-name">' + escapeHtml(n.name) + '</p>' +
          (!kid && n.scientific ? '<p class="hs-sci"><i>' + escapeHtml(n.scientific) + '</i></p>' : '') +
          '<p>' + T(kid, "It isn't in any of our places yet, so it's a brand-new find! We added it to your collection.",
                         "Not in any area's species list. Added to your collection as a new species.") +
            (im.addedPoints ? ' <strong class="hs-plus">+' + im.addedPoints + ' ⭐</strong>' : '') + '</p>' +
          (n.relatives && n.relatives.length ? '<p class="hs-muted">' + T(kid, "It's a cousin of: ", "Same genus as: ") + n.relatives.map(function(r){ return escapeHtml(r.name); }).join(", ") + '.</p>' : '') +
        '</div>' + safety() +
        '<div class="hs-sheet-actions">' +
          (ctx.postingOn && im.addedId ? '<button type="button" class="hs-btn hs-btn-primary hs-big hs-post-open" data-key="d-' + escapeHtml(im.addedId) + '">📣 ' + T(kid, "Post it for everyone", "Post it") + '</button>' : '') +
          (im.addedId ? '<button type="button" class="hs-btn hs-notes-open" data-disc="' + escapeHtml(im.addedId) + '">✏️ ' + T(kid, "Tell us what you know about it", "Add notes") + '</button>' : '') +
          '<button type="button" class="hs-btn ' + (ctx.postingOn ? '' : 'hs-btn-primary ') + 'hs-big hs-id-done">✓ ' + T(kid, "Awesome!", "Done") + '</button>' +
          '<button type="button" class="hs-btn hs-id-undo">✏️ ' + T(kid, "Not right? Fix it", "Incorrect? Remove and choose") + '</button>' +
          '<button type="button" class="hs-btn hs-open-camera">📷 ' + T(kid, "Take another", "Retake") + '</button></div>' +
        aiCredit(n);
    }
    if(im.stage === "result" && im.ai){
      var a = im.ai;
      var pct = typeof a.score === "number" ? Math.round(a.score * 100) : null;
      var html = head + pic(true) + '<div class="hs-id-best"><p class="hs-id-label">' + T(kid, "Best guess", "Top match") + '</p>' +
        '<p class="hs-id-name">' + escapeHtml(a.name) + '</p>' +
        (!kid && a.scientific ? '<p class="hs-sci"><i>' + escapeHtml(a.scientific) + '</i></p>' : '') +
        (pct !== null ? '<div class="hs-bar" role="img" aria-label="' + pct + ' percent sure"><span style="width:' + pct + '%"></span></div><p class="hs-muted">' + T(kid, pct + "% sure", "Score " + pct + "%") + '</p>' : '') +
        '</div>';
      if(a.match){
        html += '<div class="hs-note hs-note-good"><p>🎉 ' + T(kid, "That's one of ours: ", "Matches our list: ") + '<strong>' + escapeHtml((a.match.emoji || "") + " " + a.match.name) + '</strong></p></div>';
      } else {
        html += '<div class="hs-note"><p>🔍 ' + T(kid, "This one isn't on our list yet. Add it as your own discovery!", "Not in our species list. It will be saved as a new species.") + '</p>' +
          (a.relatives && a.relatives.length ? '<p>' + T(kid, "It's a cousin of: ", "Same genus as: ") + a.relatives.map(function(r){ return escapeHtml(r.name); }).join(", ") + '.</p>' : '') + '</div>';
      }
      if(a.duplicate) html += '<div class="hs-note"><p>' + T(kid, "You already have this one in your collection! Spotting it again adds another dot on your map.",
        "Already in your collection. This will be logged as another sighting.") + '</p></div>';
      html += safety();
      html += '<div class="hs-sheet-actions">' +
        '<button type="button" class="hs-btn hs-btn-primary hs-big hs-id-add">' + (a.duplicate ? '📍 ' + T(kid, "I spotted it again", "Log another sighting") : '✓ ' + T(kid, "Add to my collection", "Add to collection")) +
          (a.points ? ' <span class="hs-plus">+' + a.points + '</span>' : '') + '</button>' +
        '<button type="button" class="hs-btn hs-id-pick">✏️ ' + T(kid, "Not right? Pick it myself", "Choose a different species") + '</button>' +
        '<button type="button" class="hs-btn hs-open-camera">📷 ' + T(kid, "Take another", "Retake") + '</button>' + cancel + '</div>';
      return html + mapNoteHtml(kid) + aiCredit(a);
    }
    if(im.stage === "pick"){
      return head + pic(true) + (im.note ? '<div class="hs-note"><p>' + escapeHtml(im.note) + '</p></div>' : '') +
        pickerHtml(ctx, im, titleId) +
        '<div class="hs-sheet-actions hs-pick-actions">' +
          '<button type="button" class="hs-btn hs-btn-primary hs-big hs-id-confirm">✓ ' + T(kid, "Add to my collection", "Add to collection") + '</button>' +
          '<button type="button" class="hs-btn hs-open-camera">📷 ' + T(kid, "Take another", "Retake") + '</button>' + cancel + '</div>' +
        mapNoteHtml(kid);
    }
    // "choose"
    return head + nearHtml(ctx, im) + '<p class="hs-sheet-text">' + T(kid,
        "Take a clear photo of the plant or animal you found. Your photo stays on this device.",
        "Photograph the organism. The photo is resized and stripped of location data, and stays on this device unless an identification service is used.") + '</p>' +
      '<div class="hs-sheet-actions">' + chooseButtons + cancel + '</div>' +
      '<p class="hs-safety-mini">⚠️ ' + T(kid,
        "Keep your distance from wild animals and stay on the trail. Look, but don't pick or eat plants.",
        "Keep your distance from wildlife, stay on the trail, and don't pick or eat wild plants.") + '</p>';
  }

  // ---------- Photos ----------
  // Every photo goes through here. It is made smaller and re-saved as a plain JPEG.
  // Re-saving also drops the hidden details phones put inside photos, like where it was taken.
  // Reads a photo file as a data: address (works even where blob: pictures are blocked).
  function readAsDataUrl(blob){
    return new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onload = function(){ resolve(String(r.result)); };
      r.onerror = function(){ reject(new Error("read failed")); };
      r.readAsDataURL(blob);
    });
  }
  // Opens a picture file. Tries three ways, because some places block one of them:
  // 1) createImageBitmap (no web address needed), 2) a blob: address, 3) a data: address.
  function decodePhoto(file){
    function viaImg(url, done){
      return new Promise(function(resolve, reject){
        var img = new Image();
        img.onload = function(){ resolve({source:img, w:img.naturalWidth || img.width, h:img.naturalHeight || img.height, done:done}); };
        img.onerror = function(){ if(done) done(); reject(new Error("not an image")); };
        img.src = url;
      });
    }
    function viaBlobUrl(){
      var url = URL.createObjectURL(file);
      return viaImg(url, function(){ URL.revokeObjectURL(url); });
    }
    function viaDataUrl(){ return readAsDataUrl(file).then(function(u){ return viaImg(u, null); }); }
    var first = (typeof window.createImageBitmap === "function")
      ? window.createImageBitmap(file, {imageOrientation:"from-image"}).then(function(bm){
          return {source:bm, w:bm.width, h:bm.height, done:function(){ if(bm.close) bm.close(); }};
        })
      : Promise.reject(new Error("no createImageBitmap"));
    return first.catch(viaBlobUrl).catch(viaDataUrl);
  }
  // Redraws a photo smaller as a JPEG. This also removes hidden details (like where it was taken).
  function cleanPhoto(file, maxSide, quality){
    return decodePhoto(file).then(function(pic){
      return new Promise(function(resolve, reject){
        var w = pic.w, h = pic.h;
        if(!w || !h){ if(pic.done) pic.done(); reject(new Error("empty image")); return; }
        var scale = Math.min(1, maxSide / Math.max(w, h));
        var canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(w * scale));
        canvas.height = Math.max(1, Math.round(h * scale));
        try{
          var c2d = canvas.getContext("2d");
          c2d.fillStyle = "#ffffff";                       // see-through pictures get a white background
          c2d.fillRect(0, 0, canvas.width, canvas.height);
          c2d.drawImage(pic.source, 0, 0, canvas.width, canvas.height);
          if(pic.done) pic.done();
          canvas.toBlob(function(blob){
            if(blob) resolve(blob); else reject(new Error("could not save image"));
          }, "image/jpeg", quality);
        }catch(err){ if(pic.done) pic.done(); reject(err); }
      });
    });
  }

  // Photos are kept on this device, in a small database inside the browser (IndexedDB).
  // If the browser won't allow that, they still show for this visit, but are gone next time.
  function createPhotoStore(){
    var memory = {}, dbPromise = null;
    function openDb(){
      if(!dbPromise){
        dbPromise = new Promise(function(resolve, reject){
          if(!window.indexedDB){ reject(new Error("no storage")); return; }
          var req = window.indexedDB.open("habitat-scan-photos", 1);
          req.onupgradeneeded = function(){ req.result.createObjectStore("photos", {keyPath:"id"}); };
          req.onsuccess = function(){ resolve(req.result); };
          req.onerror = function(){ reject(req.error || new Error("storage error")); };
        });
      }
      return dbPromise;
    }
    function run(mode, work){
      return openDb().then(function(db){
        return new Promise(function(resolve, reject){
          var tx = db.transaction("photos", mode);
          var request = work(tx.objectStore("photos"));
          tx.oncomplete = function(){ resolve(request && request.result); };
          tx.onerror = tx.onabort = function(){ reject(tx.error || new Error("storage error")); };
        });
      });
    }
    return {
      put: function(id, blob){
        memory[id] = blob;
        return run("readwrite", function(store){ return store.put({id:id, blob:blob, savedAt:Date.now()}); }).catch(function(){ /* not saved for next time */ });
      },
      get: function(id){
        if(memory[id]) return Promise.resolve(memory[id]);
        return run("readonly", function(store){ return store.get(id); }).then(function(row){ return row ? row.blob : null; }).catch(function(){ return null; });
      },
      remove: function(id){
        delete memory[id];
        return run("readwrite", function(store){ return store.delete(id); }).catch(function(){ /* already gone */ });
      },
      clear: function(){
        memory = {};
        return run("readwrite", function(store){ return store.clear(); }).catch(function(){ /* nothing to clear */ });
      }
    };
  }
  var photoStore = createPhotoStore();

    // ----- showing photos: a blob: address if this page allows it, otherwise a data: address -----
    var blobImagesOk = null;
    function checkBlobImages(){
      if(blobImagesOk !== null) return Promise.resolve(blobImagesOk);
      return new Promise(function(resolve){
        var c = document.createElement("canvas"); c.width = c.height = 1;

    // Draws one species card again (for example after its photo changes), without re-sorting the list.
    function refreshCards(id){

    // ----- photo mode: "I saw it!" opens this so you can photograph that exact species -----
    function renderSheet(){

    // ----- sightings and the map -----
    // Where was this photo taken? The phone's location if allowed, otherwise the place picked in the app.
    function placeFallback(){
      var p = state.place;

      var zones = (p.kind === "zone" ? [idx.zonesById[p.id]] : (idx.zonesByArea[p.id] || [])).filter(function(z){ return z && typeof z.lat === "number"; });
      if(!zones.length) return null;
      var lat = 0, lng = 0;
      zones.forEach(function(z){ lat += z.lat; lng += z.lng; });
      var area = idx.areasById[p.id];
      return {lat:lat / zones.length, lng:lng / zones.length, how:"place", where:p.kind === "zone" ? zones[0].name : (area ? (area.short || area.name) : "")};
    }
    function getSpotLocation(){
      return new Promise(function(resolve){
        var finished = false;
        function fallback(){ if(finished) return; finished = true; resolve(placeFallback() || {how:"none"}); }
        var secure = window.isSecureContext && !(window.location && window.location.protocol === "file:");
        if(!secure || !navigator.geolocation){ fallback(); return; }

          if(finished) return;

        }, function(){ clearTimeout(timer); fallback(); }, {enableHighAccuracy:true, timeout:10000, maximumAge:0});
      });
    }
    // Logs one sighting. A plant's first sighting puts it on the map (and can earn the Plant Mapper badge).
    function addSighting(key, name, isPlant){
      var kid = isKid();

      if(last && Date.now() - last.t < SIGHT_GAP_MS){
        return Promise.resolve({counted:false, n:list.length});
      }
      return getSpotLocation().then(function(loc){
        var entry = {t:Date.now(), how:loc.how};
        if(loc.how !== "none"){ entry.lat = loc.lat; entry.lng = loc.lng; }
        if(loc.acc) entry.acc = loc.acc;
        if(loc.where) entry.where = loc.where;
        var arr = save.sightings[key] || (save.sightings[key] = []);
        arr.push(entry);
        if(arr.length > 40) arr.splice(1, arr.length - 40);    // keep the first one and the latest ones
        writeSave(save);
        var n = arr.length;
        if(n === MAP_NEEDS){
          toast("🗺️ " + name + T(kid, " is on your map!", " added to your map"));
          if(isPlant) checkBadges();
        }
        if(state.tab === "map" || state.tab === "collection") renderPanel();

        return {counted:true, n:n};
      });
    }
    // Everything this player has photographed (plants and animals), with its sightings.
    function mapEntries(group){
      var g = findGroup(group || "all"), out = [];
      Object.keys(save.sightings || {}).forEach(function(key){
        var list = save.sightings[key];
        if(!list || !list.length) return;
        var info;
        if(key.indexOf("d-") === 0){
          var d = (save.discoveries || []).filter(function(x){ return x.id === key.slice(2); })[0];
          info = d && {name:d.name, emoji:d.type === "plant" ? "🌿" : "🐾", type:d.type, latin:d.scientific, isNew:true, disc:d};
        } else {
          var sp = idx.speciesById[key];
          info = sp && {name:sp.name, emoji:sp.emoji || (sp.type === "plant" ? "🌿" : "🐾"), type:sp.type, latin:sp.latin, sp:sp};
        }
        if(!info || (g.type && info.type !== g.type)) return;

    function openInfo(key){

      el.modal.hidden = false;

      hydratePhotos();
      var mk = mapMarkers[key];

      var first = el.sheet.querySelector(".hs-info-again") || el.sheet.querySelector(".hs-sheet-cancel");
      if(first){ try{ first.focus({preventScroll:true}); }catch(err){ first.focus(); } }
